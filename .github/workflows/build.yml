# vision-pack build workflow
#
# Builds all four ROCm CV libraries inside manylinux_2_28 against the
# Quartz nightly SDK. Vision libs contain no GPU kernel code so a single
# build covers all supported GPU families — no per-family matrix needed.
#
# Designed as a reusable workflow (workflow_call) so nightly.yml can call
# it after bumping submodules, following TheRock's pattern of using one
# workflow for both PR CI and nightly delivery.
#
# Outputs:
#   vision-pack-staged-multiarch-<sha>   staged install tree (→ package.yml)
#   ctest-results-<sha>                  CTest XML results

name: build

on:
  push:
    branches: [main, develop]
    paths:
      - 'mivisionx'
      - 'rocal'
      - 'rocCV'
      - 'rocpydecode'
      - 'third-party/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, develop]
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build'
        type: string
        required: false
        default: ''
      rocm_sdk_date:
        description: 'Quartz nightly date YYYYMMDD (empty = latest)'
        type: string
        required: false
        default: ''
      release_type:
        description: 'ci | nightly — controls artifact retention'
        type: string
        required: false
        default: 'ci'
    outputs:
      artifact_name:
        description: 'Name of the uploaded staged artifact'
        value: ${{ jobs.build.outputs.artifact_name }}
      version:
        description: 'Package version string'
        value: ${{ jobs.build.outputs.version }}
  workflow_dispatch:
    inputs:
      rocm_sdk_date:
        description: 'Quartz nightly date YYYYMMDD (empty = latest)'
        required: false
        default: ''
      release_type:
        description: 'ci | nightly'
        required: false
        default: 'ci'

env:
  ROCM_PATH: /opt/rocm-nightly
  CMAKE_BUILD_TYPE: Release
  VP_BUILD_PARALLEL: 24

jobs:
  build:
    # Vision libs have no GPU kernel code — one build covers all GPU families.
    # Use TheRock's pre-built manylinux image which already has gcc-toolset-13,
    # LIBRARY_PATH, and all build prerequisites configured correctly for
    # amdclang++/lld builds. Same image TheRock uses for all its components.
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:cf4f6d9909056906e4a1c0bc4c245658a0af4c6a6174082a86adfa2d518b7aeb
      options: --user root
      # Override any ROCM_PATH the image may have set — ours points at the
      # Quartz nightly SDK tarball extracted to /opt/rocm-nightly.
      env:
        ROCM_PATH: /opt/rocm-nightly

    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      # TheRock's manylinux image has gcc-toolset-13, cmake 3.27, ninja,
      # Python 3.12 interpreter. We additionally need:
      #   dpkg       — for dpkg-deb --extract of nightly deb packages
      #   python3-devel — Python.h headers for rocCV/rocAL pybind11 builds
      #     (manylinux /opt/python builds lack dev headers in the system path)
      - name: Install extra build tools
        run: |
          yum install -y dpkg python3-devel make curl 2>/dev/null || true

          echo "=== Build environment ==="
          cmake --version
          python3 --version
          g++ --version | head -1
          echo "LIBRARY_PATH=${LIBRARY_PATH}"
          python3 -c "import sysconfig; print('Python include:', sysconfig.get_path('include'))"

          # Put manylinux Python 3.12 on PATH (interpreter + pip)
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      # Download the Quartz nightly ROCm SDK tarball.
      # Vision libs have no GPU kernel code so gfx110X (gfx11 family)
      # provides a full SDK for building — headers, cmake, libs, compiler.
      - name: Fetch Quartz nightly ROCm SDK
        env:
          SDK_DATE: ${{ inputs.rocm_sdk_date }}
        run: |
          ARGS="--gpu-family gfx110X --dest ${ROCM_PATH}"
          if [ -n "${SDK_DATE}" ]; then
            ARGS="${ARGS} --date ${SDK_DATE}"
          fi
          python3 build_tools/fetch_rocm_sdk.py ${ARGS}
          echo "SDK cmake packages available:"
          ls "${ROCM_PATH}/lib/cmake/" | head -20

      # Install RPP, rocdecode, rocJPEG dev+test packages from the nightly deb repo.
      #
      # These packages install files to ./opt/rocm/core-10.1/ inside the .deb,
      # so we extract to / (filesystem root) and they land at /opt/rocm/core-10.1/.
      # The unversioned packages (amdrocm-rpp, amdrocm-decode-test, etc.) are
      # empty stubs — the versioned 10.1 variants contain the actual files.
      #
      # After extraction we update ROCM_PATH to point at the core-10.1 overlay
      # where rpp/rocdecode/rocjpeg headers and cmake configs reside.
      - name: Install ROCm CV packages from nightly deb
        run: |
          DEB_BASE="https://rocm.nightlies.amd.com/packages-multi-arch/deb"

          # amdrocm-decode-test10.1 dropped utils/rocvideodecode/roc_video_dec.cpp
          # after build 20260805 (regression: ROCm/rocm-systems#11609).
          # We cannot distinguish good from bad builds from the Packages.gz index
          # (same installed-size; no Contents index available). Instead, download
          # each candidate deb and check for roc_video_dec.cpp directly.
          # To avoid downloading all 82MB debs, check newest builds first —
          # if AMD fixes the regression, the loop exits on the first build.
          PINNED_GOOD="20260805-30962830816"   # last known-good build
          BUILDS=$(curl -sL "${DEB_BASE}/" \
            | grep -o '[0-9]\{8\}-[0-9]*' | sort -r | head -15)
          # Prepend pinned-good at the end as guaranteed fallback
          BUILDS="${BUILDS} ${PINNED_GOOD}"
          LATEST=""
          for BUILD in ${BUILDS}; do
            PKG_GZ="${DEB_BASE}/${BUILD}/dists/stable/main/binary-amd64/Packages.gz"
            FNAME=$(curl -sL "${PKG_GZ}" 2>/dev/null | zcat 2>/dev/null \
              | awk '/^Package: amdrocm-decode-test10\.1$/{f=1} f && /^Filename:/{print $2; exit}')
            if [ -z "${FNAME}" ]; then
              echo "  Build ${BUILD}: package not found, skipping"
              continue
            fi
            echo "  Checking build ${BUILD} for roc_video_dec.cpp..."
            DEB_TMP=$(mktemp --suffix=.deb)
            curl -fsSL "${DEB_BASE}/${BUILD}/${FNAME}" -o "${DEB_TMP}" 2>/dev/null
            if dpkg-deb --contents "${DEB_TMP}" 2>/dev/null \
                | grep -qF 'roc_video_dec.cpp'; then
              LATEST="${BUILD}"
              rm -f "${DEB_TMP}"
              echo "  Found roc_video_dec.cpp in build ${BUILD}"
              break
            fi
            rm -f "${DEB_TMP}"
            echo "  Build ${BUILD}: roc_video_dec.cpp missing, trying older build"
          done
          if [ -z "${LATEST}" ]; then
            echo "ERROR: no deb build found with roc_video_dec.cpp"
            echo "Upstream issue: https://github.com/ROCm/rocm-systems/issues/11609"
            exit 1
          fi
          echo "Using nightly deb build: ${LATEST}"
          PKG_TMP=$(mktemp)
          curl -sL "${DEB_BASE}/${LATEST}/dists/stable/main/binary-amd64/Packages.gz" \
            | zcat > "${PKG_TMP}"

          # Use versioned 10.1 packages — unversioned ones are empty stubs.
          # For most packages: extract directly to / (fast, small packages).
          # For amdrocm-decode-test10.1 (82MB, contains large video files):
          # extract to a temp dir and selectively copy only the needed utils/
          # and share/ subdirs — skip the video/ directory to avoid container
          # overlay filesystem issues with large files.
          for PKG in \
            amdrocm-rpp10.1 amdrocm-rpp-dev10.1 amdrocm-rpp-test10.1 \
            amdrocm-decode-dev10.1 \
            amdrocm-jpeg-dev10.1 amdrocm-jpeg-test10.1; do
            FILENAME=$(awk "/^Package: ${PKG}$/{f=1} f && /^Filename:/{print \$2; exit}" \
              "${PKG_TMP}")
            if [ -z "${FILENAME}" ]; then
              echo "  WARNING: ${PKG} not in index — skipping"
              continue
            fi
            DEB=$(mktemp --suffix=.deb)
            echo "  Downloading ${PKG}..."
            curl -fsSL "${DEB_BASE}/${LATEST}/${FILENAME}" -o "${DEB}"
            dpkg-deb --extract "${DEB}" /
            EXTRACT_RC=$?
            rm -f "${DEB}"
            [ "${EXTRACT_RC}" -ne 0 ] && echo "  ERROR: ${PKG} failed" && exit 1
            echo "  ${PKG} -> OK"
          done

          # amdrocm-decode-test10.1 contains large video files (>80MB total).
          # Extract to temp dir and copy only share/ and include/ — skip video/.
          PKG="amdrocm-decode-test10.1"
          FILENAME=$(awk "/^Package: ${PKG}$/{f=1} f && /^Filename:/{print \$2; exit}" \
            "${PKG_TMP}")
          if [ -z "${FILENAME}" ]; then
            echo "ERROR: ${PKG} not found in index"
            exit 1
          fi
          DEB=$(mktemp --suffix=.deb)
          EXTRACT_TMP=$(mktemp -d)
          echo "  Downloading ${PKG} (large — extracting selectively)..."
          curl -fsSL "${DEB_BASE}/${LATEST}/${FILENAME}" -o "${DEB}"
          dpkg-deb --extract "${DEB}" "${EXTRACT_TMP}"
          rm -f "${DEB}"
          # Copy everything EXCEPT the video/ directory (large, not needed for build)
          CORE_SRC="${EXTRACT_TMP}/opt/rocm/core-10.1"
          CORE_DST="/opt/rocm/core-10.1"
          if [ -d "${CORE_SRC}" ]; then
            mkdir -p "${CORE_DST}"
            # Copy share/rocdecode excluding video/
            if [ -d "${CORE_SRC}/share/rocdecode" ]; then
              mkdir -p "${CORE_DST}/share/rocdecode"
              for SUBDIR in utils samples test cmake; do
                [ -d "${CORE_SRC}/share/rocdecode/${SUBDIR}" ] && \
                  cp -r "${CORE_SRC}/share/rocdecode/${SUBDIR}" "${CORE_DST}/share/rocdecode/"
              done
            fi
            # Copy any other dirs (include, lib, etc.) that may be in this pkg
            for D in include lib; do
              [ -d "${CORE_SRC}/${D}" ] && cp -r "${CORE_SRC}/${D}" "${CORE_DST}/"
            done
          fi
          rm -rf "${EXTRACT_TMP}"
          # Verify the key file landed
          ls "/opt/rocm/core-10.1/share/rocdecode/utils/rocvideodecode/roc_video_dec.cpp" \
            >/dev/null 2>&1 && echo "  ${PKG} -> OK (roc_video_dec.cpp present)" \
            || { echo "  ERROR: roc_video_dec.cpp missing after selective extract"; exit 1; }

          rm -f "${PKG_TMP}"

          # The core-10.1 overlay contains rpp, rocdecode, rocjpeg headers/cmake.
          CORE_PATH="/opt/rocm/core-10.1"
          echo "ROCM_CORE_PATH=${CORE_PATH}" >> "$GITHUB_ENV"

          # rocpydecode hardcodes ${ROCM_PATH}/share/rocdecode/utils.
          # Symlink the extracted rocdecode share into the SDK tarball path.
          # Must wait until after deb extraction completes.
          if [ -d "${CORE_PATH}/share/rocdecode" ]; then
            mkdir -p "${ROCM_PATH}/share"
            ln -sfn "${CORE_PATH}/share/rocdecode" "${ROCM_PATH}/share/rocdecode"
            echo "  symlink: ${ROCM_PATH}/share/rocdecode -> ${CORE_PATH}/share/rocdecode"
          else
            echo "  ERROR: ${CORE_PATH}/share/rocdecode not found after extraction"
            exit 1
          fi

          # Verify all critical paths
          for CHECK in \
            "${CORE_PATH}/include/rpp/rpp.h:rpp headers" \
            "${ROCM_PATH}/share/rocdecode/utils/rocvideodecode:rocdecode utils/rocvideodecode" \
            "${CORE_PATH}/include/rocjpeg/rocjpeg.h:rocjpeg headers"; do
            PATH_CHECK="${CHECK%%:*}"
            LABEL="${CHECK##*:}"
            ls "${PATH_CHECK}" >/dev/null 2>&1 \
              && echo "  ${LABEL}: OK" \
              || { echo "  ERROR: ${LABEL} not found at ${PATH_CHECK}"; exit 1; }
          done

      - name: CMake configure
        run: |
          # ROCM_PATH      = SDK tarball (/opt/rocm-nightly) — HIP, compiler, hip libs
          # ROCM_CORE_PATH = deb overlay (/opt/rocm/core-10.1) — rpp, rocdecode, rocjpeg
          # Pass both to CMAKE_PREFIX_PATH so find_package resolves both locations.
          CMAKE_PREFIX="${ROCM_PATH};${ROCM_CORE_PATH};${ROCM_CORE_PATH}/lib/llvm"

          # Use the shared Python install which has libpython3.12.so (Development.Embed).
          # The manylinux /opt/python build is statically linked — no libpython.so.
          # TheRock's image installs shared Pythons to /opt/python-shared/.
          SHARED_PY="/opt/python-shared/cp312-cp312"
          if [ -d "${SHARED_PY}" ]; then
            PYTHON_ARGS="-DPython3_ROOT_DIR=${SHARED_PY}"
            echo "Using shared Python at ${SHARED_PY}"
          else
            PYTHON_ARGS=""
            echo "Shared Python not found, using system Python"
          fi

          cmake -B build -S . \
            -GNinja \
            -DCMAKE_BUILD_TYPE="${CMAKE_BUILD_TYPE}" \
            -DROCM_PATH="${ROCM_PATH}" \
            "-DCMAKE_PREFIX_PATH=${CMAKE_PREFIX}" \
            -DVISION_PACK_ENABLE_MIVISIONX=ON \
            -DVISION_PACK_ENABLE_ROCAL=ON \
            -DVISION_PACK_ENABLE_ROCCV=ON \
            -DVISION_PACK_ENABLE_ROCPYDECODE=ON \
            -DVP_BUILD_PARALLEL_LEVEL="${VP_BUILD_PARALLEL}" \
            ${PYTHON_ARGS}

      - name: Build
        run: cmake --build build --parallel "${VP_BUILD_PARALLEL}"

      # Stage install — into build/staging/ (mirrors /opt/rocm layout).
      # Bundled sysdeps also land here via the install() rules in third-party/.
      - name: Install to staging
        run: |
          mkdir -p build/staging
          for proj in mivisionx rocCV rocpydecode rocal; do
            cmake --install "build/_subprojects/${proj}/build" \
              --prefix build/staging
          done
          # Install bundled sysdeps (turbojpeg, protobuf, lmdb, libsndfile)
          cmake --install build --prefix build/staging \
            --component rocm-sysdeps-vision 2>/dev/null || true

      - name: CTest — rocPyDecode
        working-directory: build/_subprojects/rocpydecode/build
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/staging/lib:${{ env.ROCM_PATH }}/lib
        run: |
          ctest --output-on-failure --parallel 4 \
            --test-output-size-passed 1024 \
            --test-output-size-failed 102400 \
            -T Test

      - name: CTest — MIVisionX (CPU tests only)
        working-directory: build/_subprojects/mivisionx/build
        env:
          PATH: ${{ github.workspace }}/build/staging/bin:${{ env.ROCM_PATH }}/bin:/usr/local/bin:/usr/bin:/bin
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/staging/lib:${{ env.ROCM_PATH }}/lib
        run: |
          ctest --output-on-failure --parallel 4 \
            -R "openvx_gdf_tests_CPU|openvx_vision_coverage" \
            --test-output-size-passed 1024 \
            --test-output-size-failed 102400 \
            -T Test
        continue-on-error: true

      - name: CTest — rocCV
        working-directory: build/_subprojects/rocCV/build
        env:
          LD_LIBRARY_PATH: >-
            ${{ github.workspace }}/build/staging/lib:${{ env.ROCM_PATH }}/lib:${{ env.ROCM_PATH }}/lib/llvm/lib
        run: |
          COUNT=$(ctest -N 2>&1 | grep "Total Tests" | awk '{print $NF}')
          if [ "${COUNT:-0}" -gt 0 ]; then
            ctest --output-on-failure --parallel 4 -T Test
          else
            echo "rocCV: 0 tests registered (built with TESTS=OFF)"
          fi
        continue-on-error: true

      - name: Collect build metadata
        id: meta
        run: |
          VER=$(git describe --tags --always --dirty 2>/dev/null || echo "0.1.0")
          VER="${VER#v}"
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:8}"
          ARTIFACT="vision-pack-staged-multiarch-${SHORT}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          printf '{"version":"%s","sha":"%s","rocm_path":"%s","build_type":"%s","release_type":"%s"}\n' \
            "${VER}" "${SHA}" "${ROCM_PATH}" "${CMAKE_BUILD_TYPE}" \
            "${{ inputs.release_type || 'ci' }}" \
            > build/staging/vision-pack-manifest.json
          echo "Version: ${VER}  Artifact: ${ARTIFACT}"

      - name: Upload CTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-results-${{ github.sha && fromJSON(format('["{0}"]', github.sha))[0] || 'unknown' }}
          path: build/_subprojects/*/build/Testing/
          retention-days: 7

      - name: Upload staged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: build/staging/
          # Nightly artifacts kept longer than CI artifacts
          retention-days: ${{ inputs.release_type == 'nightly' && 30 || 7 }}
