# vision-pack build workflow
#
# Builds all four ROCm CV libraries inside manylinux_2_28 against the
# Quartz nightly SDK. The vision libs do contain GPU kernels, but the HIP
# compiler emits a code object per gfx target and bundles them all into one
# fat binary, so a single build covers every architecture — no per-family
# matrix needed.
#
# Designed as a reusable workflow (workflow_call) so nightly.yml can call
# it after bumping submodules, following TheRock's pattern of using one
# workflow for both PR CI and nightly delivery.
#
# Outputs:
#   vision-pack-staged-multiarch-<sha>   staged install tree (→ package.yml)
#   ctest-results-<sha>                  CTest XML results

name: build

on:
  push:
    branches: [main, develop]
    paths:
      - 'mivisionx'
      - 'rocal'
      - 'roccv'
      - 'rocpydecode'
      - 'third-party/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, develop]
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build'
        type: string
        required: false
        default: ''
      rocm_sdk_date:
        description: 'Nightly date YYYYMMDD (empty = latest); ignored if rocm_sdk_url set'
        type: string
        required: false
        default: ''
      rocm_sdk_family:
        description: 'SDK GPU family/variant to auto-select from the index'
        type: string
        required: false
        default: ''
      rocm_sdk_url:
        description: 'Full SDK tarball URL to pin (e.g. run-id multi-arch); overrides family/date'
        type: string
        required: false
        default: ''
      release_type:
        description: 'ci | nightly — controls artifact retention'
        type: string
        required: false
        default: 'ci'
    outputs:
      artifact_name:
        description: 'Name of the uploaded staged artifact'
        value: ${{ jobs.build.outputs.artifact_name }}
      version:
        description: 'Package version string'
        value: ${{ jobs.build.outputs.version }}
  workflow_dispatch:
    inputs:
      rocm_sdk_date:
        description: 'Nightly date YYYYMMDD (empty = latest); ignored if rocm_sdk_url set'
        required: false
        default: ''
      rocm_sdk_family:
        description: 'SDK GPU family/variant to auto-select from the index'
        required: false
        default: ''
      rocm_sdk_url:
        description: 'Full SDK tarball URL to pin (e.g. run-id multi-arch); overrides family/date'
        required: false
        default: ''
      release_type:
        description: 'ci | nightly'
        required: false
        default: 'ci'

env:
  ROCM_PATH: /opt/rocm-nightly
  CMAKE_BUILD_TYPE: Release
  VP_BUILD_PARALLEL: 24
  # Default SDK family when neither rocm_sdk_url nor rocm_sdk_family is given.
  # Any family works (the compiler bundles a code object per gfx); this variant
  # bundles rpp/rocdecode/rocjpeg + share/rocdecode/utils.
  ROCM_SDK_FAMILY_DEFAULT: gfx94X-dcgpu-tests

jobs:
  build:
    # One build covers all GPU families: the HIP compiler bundles a code object
    # per gfx target into each .so, so no per-architecture build is needed.
    # Use TheRock's pre-built manylinux image which already has gcc-toolset-13,
    # LIBRARY_PATH, and all build prerequisites configured correctly for
    # amdclang++/lld builds. Same image TheRock uses for all its components.
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:cf4f6d9909056906e4a1c0bc4c245658a0af4c6a6174082a86adfa2d518b7aeb
      options: --user root
      # Override any ROCM_PATH the image may have set — ours points at the
      # Quartz nightly SDK tarball extracted to /opt/rocm-nightly.
      env:
        ROCM_PATH: /opt/rocm-nightly

    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      # The job runs as root inside the container while the checkout is owned
      # by the runner user, so git refuses to operate on it at all. That had
      # been masked by `2>/dev/null || echo` fallbacks around the version
      # lookup, which meant a tag would never be found even once the project
      # is tagged.
      - name: Trust the workspace checkout
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # TheRock's manylinux image has gcc-toolset-13, cmake 3.27, ninja,
      # Python 3.12 interpreter. We additionally need:
      #   python3-devel — Python.h headers for rocCV/rocAL pybind11 builds
      #     (manylinux /opt/python builds lack dev headers in the system path)
      - name: Install extra build tools
        run: |
          # patchelf: rewrite bundled sysdep SONAMEs post-build for side-by-side
          # isolation from host copies (rewrite_sonames.py, #4).
          yum install -y python3-devel make curl patchelf 2>/dev/null || true

          # TheRock's image ships cmake 3.27, which silently ignores the
          # EXCLUDE_FROM_ALL keyword on FetchContent_Declare (added in cmake
          # 3.28). rocCV declares its bundled dlpack/pybind11 with that keyword
          # precisely so their install() rules don't fire — but on 3.27 the
          # keyword is a no-op, so dlpack installs its headers + cmake config
          # into the tree and they leak into the packages. Install a cmake >=3.28
          # so rocCV's existing EXCLUDE_FROM_ALL is honoured and the dlpack
          # install is suppressed at the source. Pinned below 3.30 to stay clear
          # of the stricter cmake_minimum_required policy handling that older
          # bundled deps (e.g. libsndfile) trip over.
          /opt/python/cp312-cp312/bin/python3 -m pip install --quiet "cmake~=3.28.0"
          hash -r

          echo "=== Build environment ==="
          cmake --version
          python3 --version
          g++ --version | head -1
          echo "LIBRARY_PATH=${LIBRARY_PATH}"
          python3 -c "import sysconfig; print('Python include:', sysconfig.get_path('include'))"

          # Put manylinux Python 3.12 on PATH (interpreter + pip) — this also
          # puts the pip-installed cmake >=3.28 ahead of the image's 3.27.
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      # Download the nightly ROCm SDK tarball.
      # The dcgpu-tests variant bundles the full SDK (HIP, compiler,
      # rocm_sysdeps) *plus* rpp, rocDecode, rocJPEG headers/cmake and the
      # rocDecode build utils (share/rocdecode/utils) under one prefix — so
      # no separate deb overlay is needed. Vision libs have no GPU kernel
      # code, so a single-family SDK builds all supported GPU families.
      - name: Fetch nightly ROCm SDK
        env:
          SDK_DATE: ${{ inputs.rocm_sdk_date }}
          SDK_FAMILY: ${{ inputs.rocm_sdk_family }}
          SDK_URL: ${{ inputs.rocm_sdk_url }}
        run: |
          ARGS="--dest ${ROCM_PATH}"
          if [ -n "${SDK_URL}" ]; then
            # Pin an exact tarball (e.g. run-id multi-arch S3 artifact).
            ARGS="${ARGS} --url ${SDK_URL}"
          else
            FAMILY="${SDK_FAMILY:-${ROCM_SDK_FAMILY_DEFAULT}}"
            ARGS="${ARGS} --gpu-family ${FAMILY}"
            [ -n "${SDK_DATE}" ] && ARGS="${ARGS} --date ${SDK_DATE}"
          fi
          python3 build_tools/fetch_rocm_sdk.py ${ARGS} > /tmp/sdk-fetch.log 2>&1 \
            || { cat /tmp/sdk-fetch.log; exit 1; }
          cat /tmp/sdk-fetch.log
          # Record which tarball was actually resolved. "latest" moves, so
          # without this a nightly that breaks cannot be reproduced (#29).
          RESOLVED="$(sed -n 's/^Selected[^:]*: //p' /tmp/sdk-fetch.log | head -1)"
          echo "VP_RESOLVED_SDK=${RESOLVED}" >> "$GITHUB_ENV"
          echo "Resolved SDK: ${RESOLVED:-<unknown>}"
          echo "SDK cmake packages available:"
          ls "${ROCM_PATH}/lib/cmake/" | head -30

          # Verify the SDK carries everything we used to pull from deb overlays.
          for CHECK in \
            "${ROCM_PATH}/include/rpp/rpp.h:rpp headers" \
            "${ROCM_PATH}/include/rocjpeg/rocjpeg.h:rocjpeg headers" \
            "${ROCM_PATH}/share/rocdecode/utils/rocvideodecode/roc_video_dec.cpp:rocdecode utils"; do
            PATH_CHECK="${CHECK%%:*}"
            LABEL="${CHECK##*:}"
            ls "${PATH_CHECK}" >/dev/null 2>&1 \
              && echo "  ${LABEL}: OK" \
              || { echo "  ERROR: ${LABEL} not found in SDK tarball"; exit 1; }
          done

      - name: CMake configure
        run: |
          # Single prefix — the dcgpu-tests SDK tarball carries HIP, compiler,
          # rpp, rocdecode, rocjpeg, and rocdecode/utils all under ROCM_PATH.
          CMAKE_PREFIX="${ROCM_PATH};${ROCM_PATH}/lib/llvm"

          # Use the shared Python install which has libpython3.12.so (Development.Embed).
          # The manylinux /opt/python build is statically linked — no libpython.so.
          # TheRock's image installs shared Pythons to /opt/python-shared/.
          SHARED_PY="/opt/python-shared/cp312-cp312"
          if [ -d "${SHARED_PY}" ]; then
            PYTHON_ARGS="-DPython3_ROOT_DIR=${SHARED_PY}"
            echo "Using shared Python at ${SHARED_PY}"
          else
            PYTHON_ARGS=""
            echo "Shared Python not found, using system Python"
          fi

          cmake -B build -S . \
            -GNinja \
            -DCMAKE_BUILD_TYPE="${CMAKE_BUILD_TYPE}" \
            -DROCM_PATH="${ROCM_PATH}" \
            "-DCMAKE_PREFIX_PATH=${CMAKE_PREFIX}" \
            -DVISION_PACK_ENABLE_MIVISIONX=ON \
            -DVISION_PACK_ENABLE_ROCAL=ON \
            -DVISION_PACK_ENABLE_ROCCV=ON \
            -DVISION_PACK_ENABLE_ROCPYDECODE=ON \
            -DVP_BUILD_PARALLEL_LEVEL="${VP_BUILD_PARALLEL}" \
            ${PYTHON_ARGS}
          # Log which Python was selected so sub-build failures are diagnosable
          cmake -B build -S . -N -L 2>/dev/null | grep -i "Python3_ROOT\|Python3_EXECUTABLE" || true

      - name: Build
        run: |
          cmake --build build --parallel "${VP_BUILD_PARALLEL}" \
            --target vp_mivisionx vp_roccv vp_rocal vp_rocpydecode

      # Stage install — into build/staging/ (mirrors /opt/rocm layout).
      # Bundled sysdeps also land here via the install() rules in third-party/.
      - name: Install to staging
        run: |
          mkdir -p build/staging
          # Copy each subproject's completed stage tree into build/staging.
          # We copy rather than re-run `cmake --install --prefix` because some
          # upstream install rules use absolute DESTINATION
          # ${CMAKE_INSTALL_PREFIX}/... paths (e.g. MIVisionX header installs),
          # which a --prefix override does NOT relocate — so headers silently
          # never reached build/staging and CPack later failed on a missing
          # include/mivisionx. The per-project stage dirs already contain the
          # full include/ + lib/ + bin/ + share/ tree, so copying is faithful.
          for proj in mivisionx roccv rocal rocpydecode; do
            stage="build/_subprojects/${proj}/stage"
            if [ ! -d "${stage}" ]; then
              echo "ERROR: ${proj} has no stage dir"
              exit 1
            fi
            echo "Staging ${proj} from ${stage}"
            cp -a "${stage}/." build/staging/
          done
          # Install the bundled third-party runtime deps (protobuf, turbojpeg,
          # lmdb, libsndfile) → lib/rocm_sysdeps/lib/. These live in the
          # top-level build tree under the "runtime" component (see
          # third-party/CMakeLists.txt); the packaging job then repackages this
          # dir as the amdrocm-vision-sysdeps package, same as TheRock ships its
          # rocm_sysdeps. NOT --component rocm-sysdeps-vision: that name only
          # exists in the packaging project, so it silently matched nothing.
          cmake --install build --prefix build/staging --component runtime

      # Side-by-side isolation (#4): rename the bundled sysdeps
      # (protobuf/turbojpeg/lmdb/libsndfile) to private *-rocm-vision SONAMEs and
      # rewrite librocal.so's DT_NEEDED to match, so a host copy of any of these
      # on the default loader path can never shadow our bundled build. Runs here
      # because the bundled .so's and librocal.so only coexist after staging.
      - name: Rewrite bundled sysdep SONAMEs (SxS isolation, #4)
        run: python3 build_tools/rewrite_sonames.py build/staging

      # Fail fast if the staged install is missing anything the packaging or
      # test stages rely on — libs, the runvx tool, and rocAL's test dataset.
      - name: Verify install
        run: |
          FAIL=0
          SYSDEPS="build/staging/lib/rocm_sysdeps/lib"
          for CHECK in \
            "build/staging/lib/libopenvx.so:mivisionx libopenvx" \
            "build/staging/lib/librocal.so:rocAL librocal" \
            "build/staging/lib/libroccv.so:rocCV libroccv" \
            "build/staging/lib/rocal_pybind*.so:rocAL Python binding" \
            "build/staging/lib/rocpycv*.so:rocCV Python binding" \
            "build/staging/lib/rocpydecode*.so:rocPyDecode Python binding" \
            "build/staging/lib/rocpyjpegdecode*.so:rocPyJPEGDecode Python binding" \
            "build/staging/lib/pyRocVideoDecode:rocPyDecode Python package" \
            "build/staging/lib/pyRocJpegDecode:rocPyJPEGDecode Python package" \
            "build/staging/share/rocpydecode/tests:rocPyDecode test sources" \
            "build/staging/bin/runvx:mivisionx runvx tool" \
            "build/staging/share/rocal/test/data/images/AMD-tinyDataSet:rocAL test data" \
            "${SYSDEPS}/libturbojpeg-rocm-vision.so*:bundled turbojpeg" \
            "${SYSDEPS}/libprotobuf-rocm-vision.so*:bundled protobuf" \
            "${SYSDEPS}/liblmdb-rocm-vision.so*:bundled lmdb" \
            "${SYSDEPS}/libsndfile-rocm-vision.so*:bundled libsndfile"; do
            PATH_CHECK="${CHECK%%:*}"
            LABEL="${CHECK##*:}"
            if ls ${PATH_CHECK} >/dev/null 2>&1; then
              echo "  ${LABEL}: OK"
            else
              echo "  ERROR: ${LABEL} missing (${PATH_CHECK})"
              FAIL=1
            fi
          done
          # Build-time-only deps must NOT ship in the artifact. dlpack is compiled
          # into rocpycv.so/rocal_pybind.so; rocCV declares it FetchContent
          # EXCLUDE_FROM_ALL so its install() rules are skipped — but that keyword
          # only works on cmake >=3.28 (we install it above). Assert dlpack stays
          # out of staging so a cmake downgrade, or a submodule dropping the
          # keyword, is caught here rather than by a downstream user.
          echo "=== build-time-only deps absent from staging? ==="
          for NEG in \
            "build/staging/include/dlpack:dlpack headers" \
            "build/staging/lib/cmake/dlpack:dlpack cmake config"; do
            NEG_PATH="${NEG%%:*}"
            NEG_LABEL="${NEG##*:}"
            if [ -e "${NEG_PATH}" ]; then
              echo "  ERROR: ${NEG_LABEL} leaked into staging (${NEG_PATH})"
              FAIL=1
            else
              echo "  ${NEG_LABEL} absent: OK"
            fi
          done
          # rocpydecode modules must sit in lib/ with every other vision .so,
          # not lib64/ (rocpydecode uses GNUInstallDirs, which defaults to lib64
          # on this image; we pass -DCMAKE_INSTALL_LIBDIR=lib to override).
          echo "=== rocpydecode modules in lib/ (not lib64/)? ==="
          for MOD in rocpydecode rocpyjpegdecode; do
            if ls build/staging/lib64/${MOD}*.so >/dev/null 2>&1; then
              echo "  ERROR: ${MOD} staged in lib64/ instead of lib/ (CMAKE_INSTALL_LIBDIR override lost)"
              FAIL=1
            elif ls build/staging/lib/${MOD}*.so >/dev/null 2>&1; then
              echo "  ${MOD} in lib/: OK"
            else
              echo "  ERROR: ${MOD} missing from staging/lib/"
              FAIL=1
            fi
          done
          echo "=== Staged bundled runtime deps ==="
          ls -la "${SYSDEPS}" 2>/dev/null || echo "(rocm_sysdeps/lib missing)"
          # rocAL must link the shared protobuf (#10) via the isolated SONAME
          # (#4): librocal.so should list libprotobuf-rocm-vision.so as a
          # dynamic dependency, not statically embed it or link the stock name.
          echo "=== librocal.so NEEDED protobuf? ==="
          NEEDED="$(readelf -d build/staging/lib/librocal.so 2>/dev/null | grep -i NEEDED)"
          if echo "${NEEDED}" | grep -qi "libprotobuf-rocm-vision"; then
            echo "  librocal links isolated shared protobuf: OK"
          else
            echo "  ERROR: librocal.so does not list libprotobuf-rocm-vision.so as NEEDED"
            FAIL=1
          fi
          # SxS guarantee (#4): no stock bundled SONAME may remain NEEDED — a
          # leftover stock name is exactly what a host copy could shadow.
          echo "=== librocal.so free of stock bundled SONAMEs? ==="
          if echo "${NEEDED}" \
              | grep -Ei "lib(protobuf|protobuf-lite|turbojpeg|jpeg|lmdb|sndfile)\.so" \
              | grep -qiv "rocm-vision"; then
            echo "  ERROR: librocal.so still references a stock bundled SONAME:"
            echo "${NEEDED}" | grep -Ei "lib(protobuf|protobuf-lite|turbojpeg|jpeg|lmdb|sndfile)\.so" \
              | grep -iv "rocm-vision"
            FAIL=1
          else
            echo "  no stock bundled SONAMEs referenced: OK"
          fi
          # SxS guarantee (#4): librocal.so must carry an RPATH to rocm_sysdeps.
          # rocAL forces CMAKE_SKIP_INSTALL_RPATH, so rewrite_sonames.py re-adds
          # it; without it the loader can't find the isolated *-rocm-vision deps
          # even though they sit in rocm_sysdeps/lib (the clean-runner failure).
          echo "=== librocal.so RPATH to rocm_sysdeps? ==="
          RPATH="$(readelf -d build/staging/lib/librocal.so 2>/dev/null \
            | grep -Ei 'R(UN)?PATH')"
          echo "  ${RPATH:-<none>}"
          if echo "${RPATH}" | grep -q 'rocm_sysdeps/lib'; then
            echo "  librocal RPATH resolves bundled sysdeps: OK"
          else
            echo "  ERROR: librocal.so has no RPATH to rocm_sysdeps/lib"
            FAIL=1
          fi
          # libomp ships at lib/llvm/lib, so any library with a NEEDED on it
          # must carry $ORIGIN/llvm/lib or it aborts at load (#43). Selected by
          # NEEDED rather than by name to cover libs that add OpenMP later.
          echo "=== libs NEEDing libomp can resolve it? ==="
          for SO in build/staging/lib/*.so*; do
            { [ -f "${SO}" ] && [ ! -L "${SO}" ]; } || continue
            patchelf --print-needed "${SO}" 2>/dev/null \
              | grep -q '^libomp\.so' || continue
            RP="$(patchelf --print-rpath "${SO}" 2>/dev/null || true)"
            if printf '%s' "${RP}" | tr ':' '\n' | grep -q 'llvm/lib$'; then
              echo "  $(basename "${SO}"): OK"
            else
              echo "  ERROR: $(basename "${SO}") NEEDs libomp.so but its RUNPATH"
              echo "         lacks llvm/lib (${RP:-<none>})"
              FAIL=1
            fi
          done
          # Bundled deps must ship a RUNPATH that survives leaving the build
          # machine: no absolute stage paths, and no empty tokens, which the
          # loader resolves against the working directory (#45).
          echo "=== staged ELF RUNPATHs are relocatable? ==="
          for SO in build/staging/lib/*.so* "${SYSDEPS}"/lib*.so*; do
            { [ -f "${SO}" ] && [ ! -L "${SO}" ]; } || continue
            RP="$(patchelf --print-rpath "${SO}" 2>/dev/null || true)"
            if [ -z "${RP}" ]; then
              echo "  $(basename "${SO}"): no RUNPATH: OK"
              continue
            fi
            BAD="$(printf '%s' "${RP}" | tr ':' '\n' \
              | sed 's/^$/<empty>/' | grep -v '^\$ORIGIN' || true)"
            if [ -n "${BAD}" ]; then
              echo "  ERROR: $(basename "${SO}") has non-relocatable RUNPATH entries:"
              echo "${BAD}" | sed 's/^/           /'
              FAIL=1
            else
              echo "  $(basename "${SO}"): ${RP}: OK"
            fi
          done
          # ROCm vendors its sysdeps under renamed librocm_sysdeps_<name>
          # SONAMEs, so a plain NEEDED on something ROCm also vendors (libz,
          # libzstd, libelf, libnuma, libdrm, ...) means the host copy was
          # linked instead of the one shipped in the tree. This holds today
          # because the bundled deps are built without external codecs; the
          # gate prevents a flag change from regressing it silently.
          echo "=== deps sourced from rocm_sysdeps, not the host? ==="
          ROCM_SYS="${ROCM_PATH}/lib/rocm_sysdeps/lib"
          BASE_RE='^(libc|libm|libdl|libpthread|librt|libstdc\+\+|libgcc_s|ld-linux-x86-64|libomp)\.so'
          for SO in build/staging/lib/*.so* "${SYSDEPS}"/*.so*; do
            { [ -f "${SO}" ] && [ ! -L "${SO}" ]; } || continue
            for N in $(patchelf --print-needed "${SO}" 2>/dev/null); do
              case "${N}" in librocm_sysdeps_*|*rocm-vision*) continue ;; esac
              printf '%s' "${N}" | grep -qE "${BASE_RE}" && continue
              STEM="$(printf '%s' "${N}" | sed -n 's/^lib\([a-z0-9+_-]*\)\.so.*/\1/p')"
              [ -n "${STEM}" ] || continue
              if ls "${ROCM_SYS}"/librocm_sysdeps_"${STEM}".so* >/dev/null 2>&1; then
                echo "  ERROR: $(basename "${SO}") NEEDs ${N} from the host, but"
                echo "         ROCm vendors librocm_sysdeps_${STEM} in rocm_sysdeps"
                FAIL=1
              fi
            done
          done
          echo "  host-duplicate check complete"
          # Each vision lib carries one HIP code object per gfx target in its
          # .hip_fatbin. The target list comes from the compiler default (no
          # AMDGPU_TARGETS is set here), so it shifts with the SDK: log the
          # coverage for diffing between runs and fail if a lib has none.
          # Do not use `llvm-objdump --offloading`: it extracts each bundle as
          # a file beside the library, polluting the staging tree.
          # A versioned .so must be one real file plus symlinks. If the chain is
          # flattened into duplicate regular files the loader maps the library
          # twice under two inodes, and libvx_rpp's exported
          # get_kernels_to_publish interposes to the first copy while
          # vxPublishKernels runs in the second against a NULL Kernel_List —
          # a segfault in rocalCreate() (#43).
          echo "=== versioned SO chains are symlinks, not copies? ==="
          for BASE in libopenvx libvxu libvx_rpp librocal libroccv; do
            REAL=0
            for SO in build/staging/lib/${BASE}.so*; do
              [ -e "${SO}" ] || continue
              [ -L "${SO}" ] && continue
              REAL=$((REAL + 1))
            done
            [ "${REAL}" -eq 0 ] && continue
            if [ "${REAL}" -eq 1 ]; then
              echo "  ${BASE}: 1 real file + symlinks: OK"
            else
              echo "  ERROR: ${BASE} has ${REAL} real files; the SONAME chain"
              echo "         was flattened into duplicate copies"
              FAIL=1
            fi
          done
          echo "=== bundled GPU code objects per library ==="
          for BASE in libopenvx libvx_rpp libroccv librocal; do
            SO="$(readlink -f "build/staging/lib/${BASE}.so" 2>/dev/null || true)"
            [ -n "${SO}" ] && [ -f "${SO}" ] || continue
            FAT="$(mktemp)"
            ARCHES=""
            if objcopy -O binary --only-section=.hip_fatbin "${SO}" "${FAT}" 2>/dev/null \
               && [ -s "${FAT}" ]; then
              ARCHES="$(strings -a "${FAT}" | grep -oE 'gfx[0-9a-f]+' \
                | sort -u | tr '\n' ' ')"
            fi
            rm -f "${FAT}"
            COUNT="$(printf '%s' "${ARCHES}" | wc -w)"
            echo "  ${BASE}: ${COUNT} arch(es): ${ARCHES:-<none>}"
            if [ "${COUNT}" -eq 0 ]; then
              echo "  ERROR: ${BASE} ships no GPU code objects"
              FAIL=1
            fi
          done
          # librocal calls the raw libjpeg API (jpeg_std_error) but rocAL only
          # links libturbojpeg, so rewrite_sonames.py adds the isolated libjpeg
          # as an explicit NEEDED. Without it librocal.so fails to load (#39).
          echo "=== librocal.so NEEDs isolated libjpeg? ==="
          if echo "${NEEDED}" | grep -qi 'libjpeg-rocm-vision\.so'; then
            echo "  librocal links isolated libjpeg: OK"
          else
            echo "  ERROR: librocal.so has no NEEDED on libjpeg-rocm-vision.so"
            echo "         (raw libjpeg API jpeg_std_error would be unresolved)"
            FAIL=1
          fi
          # Each isolated SONAME must have its versioned loader symlink so the
          # DT_NEEDED entry resolves (e.g. libprotobuf-rocm-vision.so.32).
          echo "=== isolated SONAME symlinks resolve? ==="
          for SO in $(readelf -d build/staging/lib/librocal.so 2>/dev/null \
              | grep -i NEEDED | grep -oiE 'lib[a-z0-9._-]*-rocm-vision\.so[0-9.]*'); do
            if [ -e "${SYSDEPS}/${SO}" ]; then
              echo "  ${SO}: OK"
            else
              echo "  ERROR: NEEDED ${SO} has no file/symlink in rocm_sysdeps/lib"
              FAIL=1
            fi
          done
          [ "${FAIL}" -eq 0 ] || { echo "Staged install verification failed"; exit 1; }

      - name: Collect build metadata
        id: meta
        run: |
          # Deliberately no --always: with no tags in the repo it would return a
          # bare commit sha as the package version, which is not a meaningful
          # version to compare and makes the inter-package Depends
          # unsatisfiable. Let describe fail instead and derive the version from
          # the declared project version, keeping the commit as build metadata.
          VER="$(git describe --tags --dirty 2>/dev/null || true)"
          VER="${VER#v}"
          if [ -z "${VER}" ]; then
            PROJ_VER="$(sed -n 's/^ *VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1)"
            VER="${PROJ_VER:-0.2.0}+g$(git rev-parse --short HEAD)"
            echo "::notice::no tag found; derived package version ${VER}"
          fi
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:8}"
          ARTIFACT="vision-pack-staged-multiarch-${SHORT}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          # Manifest lives under share/vision-pack/ (a proper ROCm subdir), not
          # the staging root — otherwise the dist tarball drops it straight into
          # /opt/rocm/vision-pack-manifest.json (#37). It records the resolved
          # commit of every submodule and the gfx coverage of each library, so a
          # shipped artifact can be traced back to its inputs (#29).
          python3 build_tools/generate_manifest.py \
            --output build/staging/share/vision-pack/vision-pack-manifest.json \
            --version "${VER}" \
            --rocm-path "${ROCM_PATH}" \
            --rocm-sdk "${VP_RESOLVED_SDK:-}" \
            --build-type "${CMAKE_BUILD_TYPE}" \
            --release-type "${{ inputs.release_type || 'ci' }}" \
            --staging-dir build/staging
          echo "Version: ${VER}  Artifact: ${ARTIFACT}"

      # Pack the staging tree before uploading. actions/upload-artifact stores
      # neither symlinks (it follows them and uploads copies) nor the Unix
      # permission bits, and both matter here:
      #   - libvx_rpp.so/.so.3/.so.3.3.2 arrive as three identical regular
      #     files, so the loader loads the library twice under two inodes and
      #     vxPublishKernels dereferences a NULL Kernel_List — every rocAL
      #     program segfaults in rocalCreate() (#43).
      #   - bin/runvx arrives 0644 and every runvx-based test fails to execute
      #     (#44).
      # A tarball round-trips both intact, so every consumer (test job,
      # packaging job, dist tarball) receives the tree exactly as staged.
      - name: Pack staged tree
        run: |
          tar -czf vision-pack-staging.tar.gz -C build/staging .
          echo "Packed $(du -h vision-pack-staging.tar.gz | cut -f1)"

      - name: Upload staged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: vision-pack-staging.tar.gz
          # Nightly artifacts kept longer than CI artifacts
          retention-days: ${{ inputs.release_type == 'nightly' && 30 || 7 }}

  # ---------------------------------------------------------------------------
  # Package stage — turn the staged tree into DEB + RPM + a multiarch tarball
  # (vision-pack-dist-linux-multiarch-<ver>.tar.gz), same as TheRock's dist
  # tarball. Runs on every build so CI artifacts include installable packages,
  # not just the raw staging tree. Uploaded as vision-pack-{deb,rpm,tarball}-*.
  # ---------------------------------------------------------------------------
  package:
    needs: build
    uses: ./.github/workflows/package.yml
    with:
      artifact_name: ${{ needs.build.outputs.artifact_name }}
      package_version: ${{ needs.build.outputs.version }}
      release_type: ${{ inputs.release_type || 'ci' }}
      sha: ${{ inputs.ref || github.sha }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Test stage — one matrix leg per library. Consumes the published dist
  # tarball (same tree CPack packages), unpacks it into ROCM_PATH, then
  # configures/runs that library's installed test suite. GPU suites skip
  # cleanly when /dev/kfd is absent; CPU configure/build/test failures are red.
  # ---------------------------------------------------------------------------
  test:
    needs: [build, package]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:cf4f6d9909056906e4a1c0bc4c245658a0af4c6a6174082a86adfa2d518b7aeb
      options: --user root
      env:
        ROCM_PATH: /opt/rocm-nightly
    strategy:
      fail-fast: false
      matrix:
        include:
          - lib: mivisionx
          - lib: roccv
          - lib: rocal
          - lib: rocpydecode

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Install extra build tools
        run: |
          yum install -y python3-devel make curl 2>/dev/null || true
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      - name: Fetch nightly ROCm SDK
        env:
          SDK_DATE: ${{ inputs.rocm_sdk_date }}
          SDK_FAMILY: ${{ inputs.rocm_sdk_family }}
          SDK_URL: ${{ inputs.rocm_sdk_url }}
        run: |
          ARGS="--dest ${ROCM_PATH}"
          if [ -n "${SDK_URL}" ]; then
            ARGS="${ARGS} --url ${SDK_URL}"
          else
            FAMILY="${SDK_FAMILY:-${ROCM_SDK_FAMILY_DEFAULT}}"
            ARGS="${ARGS} --gpu-family ${FAMILY}"
            [ -n "${SDK_DATE}" ] && ARGS="${ARGS} --date ${SDK_DATE}"
          fi
          python3 build_tools/fetch_rocm_sdk.py ${ARGS}

      - name: Download dist tarball
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.tarball_artifact }}
          path: dist

      - name: Install dist tarball into ROCM_PATH
        run: |
          tar -xzf dist/vision-pack-dist-linux-multiarch-*.tar.gz -C "${ROCM_PATH}"
          echo "runvx: $(stat -c '%a %n' "${ROCM_PATH}/bin/runvx" 2>/dev/null || echo absent)"
          echo "Installed test sources:"
          ls -d "${ROCM_PATH}"/share/${{ matrix.lib }}/test 2>/dev/null || true

      - name: Build & run tests — ${{ matrix.lib }}
        env:
          PATH: ${{ env.ROCM_PATH }}/bin:/opt/python/cp312-cp312/bin:/usr/local/bin:/usr/bin:/bin
          LD_LIBRARY_PATH: >-
            ${{ env.ROCM_PATH }}/lib:${{ env.ROCM_PATH }}/lib/llvm/lib:${{ env.ROCM_PATH }}/lib/rocm_sysdeps/lib
          AGO_DEFAULT_TARGET: CPU
          HIP_PLATFORM: amd
        run: |
          REQUIRES_GPU=0
          case "${{ matrix.lib }}" in
            mivisionx)
              TEST_SRC="${ROCM_PATH}/share/mivisionx/test"
              FILTER='-R openvx_gdf_tests_CPU|openvx_vision_coverage'
              EXTRA_CMAKE='' ;;
            rocal)
              TEST_SRC="${ROCM_PATH}/share/rocal/test"
              FILTER='-R _cpu$'
              REQUIRES_GPU=1
              EXTRA_CMAKE='' ;;
            roccv)
              TEST_SRC="${ROCM_PATH}/share/roccv/test/cpp"
              FILTER=''
              REQUIRES_GPU=1
              EXTRA_CMAKE='-DCMAKE_EXE_LINKER_FLAGS=-pthread' ;;
            rocpydecode)
              TEST_SRC=''
              FILTER=''
              EXTRA_CMAKE='' ;;
          esac

          if [ -z "${TEST_SRC}" ] || [ ! -d "${TEST_SRC}" ]; then
            echo "${{ matrix.lib }}: no installed test sources — skipping ctest"
            exit 0
          fi

          if [ "${REQUIRES_GPU}" = "1" ] && [ ! -e /dev/kfd ]; then
            echo "::warning::${{ matrix.lib }}: no ROCm GPU on this runner (/dev/kfd absent) — skipping its ctest suite. CPU runtime coverage is provided by the import smoke test."
            exit 0
          fi

          echo "=== Configuring installed test sources at ${TEST_SRC} ==="
          cmake -B test-build -S "${TEST_SRC}" \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DROCM_PATH="${ROCM_PATH}" \
            -DBACKEND=HIP \
            "-DCMAKE_PREFIX_PATH=${ROCM_PATH};${ROCM_PATH}/lib/cmake;${ROCM_PATH}/lib/llvm" \
            ${EXTRA_CMAKE}

          echo "=== Building tests ==="
          cmake --build test-build --parallel 4

          echo "=== Running ctest ==="
          cd test-build
          COUNT=$(ctest -N 2>&1 | awk '/Total Tests/{print $NF}')
          echo "Registered tests: ${COUNT:-0}"
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "${{ matrix.lib }}: 0 tests registered — nothing to run"
            exit 0
          fi
          ctest --output-on-failure --parallel 4 \
            ${FILTER} \
            --test-output-size-passed 1024 \
            --test-output-size-failed 102400 \
            -T Test

      # rocCV ships a real package config, and that config calls
      # find_dependency(HIP). It can only be resolved where the SDK is present,
      # so the downstream find_package test for it belongs here rather than in
      # package.yml's findpackage-test, which runs without ROCm on purpose.
      - name: Downstream find_package(roccv)
        if: matrix.lib == 'roccv'
        run: |
          set -eu
          WORK="$(mktemp -d)"
          cat > "${WORK}/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(vp_roccv_findpackage LANGUAGES CXX)
          find_package(roccv REQUIRED CONFIG)
          message(STATUS "roccv_FOUND=${roccv_FOUND}")
          message(STATUS "roccv_DIR=${roccv_DIR}")
          CMAKE
          cmake -S "${WORK}" -B "${WORK}/build" \
            -DROCM_PATH="${ROCM_PATH}" \
            "-DCMAKE_PREFIX_PATH=${ROCM_PATH};${ROCM_PATH}/lib/cmake;${ROCM_PATH}/lib/llvm"
          echo "find_package(roccv CONFIG) resolved against the installed tree: OK"

      # Python import smoke test. CTest can pass while the pybind module is
      # broken (unresolved symbol from a bad link surfaces only at import).
      # ModuleNotFoundError / ImportError fail the leg — amdrocm-pydecode is a
      # required product package. A later runtime exception (no GPU) is tolerated.
      - name: Python import smoke test — ${{ matrix.lib }}
        if: matrix.lib == 'rocal' || matrix.lib == 'roccv' || matrix.lib == 'rocpydecode'
        env:
          PATH: ${{ env.ROCM_PATH }}/bin:/opt/python/cp312-cp312/bin:/usr/local/bin:/usr/bin:/bin
          LD_LIBRARY_PATH: >-
            ${{ env.ROCM_PATH }}/lib:${{ env.ROCM_PATH }}/lib/llvm/lib:${{ env.ROCM_PATH }}/lib/rocm_sysdeps/lib
          PYTHONPATH: ${{ env.ROCM_PATH }}/lib
          HIP_PLATFORM: amd
        run: |
          case "${{ matrix.lib }}" in
            rocal)        MODULES="rocal_pybind" ;;
            roccv)        MODULES="rocpycv" ;;
            rocpydecode)  MODULES="rocpydecode rocpyjpegdecode" ;;
          esac
          for MOD in ${MODULES}; do
            echo "=== import ${MOD} ==="
            python3 - "${MOD}" <<'PY'
          import importlib, sys
          mod = sys.argv[1]
          try:
              importlib.import_module(mod)
              print(f"  import {mod}: OK")
          except ModuleNotFoundError as e:
              print(f"  ERROR: import {mod} not found on sys.path — the binding was not "
                    f"built/staged: {e}")
              sys.exit(1)
          except ImportError as e:
              print(f"  ERROR: import {mod} failed to link: {e}")
              sys.exit(1)
          except Exception as e:
              print(f"  import {mod} linked; runtime init raised "
                    f"{type(e).__name__}: {e} (tolerated on CPU runner)")
          PY
          done

      - name: Run installed Python tests — rocpydecode
        if: matrix.lib == 'rocpydecode'
        env:
          PATH: ${{ env.ROCM_PATH }}/bin:/opt/python/cp312-cp312/bin:/usr/local/bin:/usr/bin:/bin
          LD_LIBRARY_PATH: >-
            ${{ env.ROCM_PATH }}/lib:${{ env.ROCM_PATH }}/lib/llvm/lib:${{ env.ROCM_PATH }}/lib/rocm_sysdeps/lib
          PYTHONPATH: ${{ env.ROCM_PATH }}/lib
          HIP_PLATFORM: amd
        run: |
          TEST_DIR="${ROCM_PATH}/share/rocpydecode/tests"
          if [ ! -d "${TEST_DIR}" ]; then
            echo "ERROR: amdrocm-pydecode-test sources missing from the dist tarball (${TEST_DIR})"
            exit 1
          fi
          # types_test.py only inspects pyRocVideoDecode.types — no GPU, no media.
          if [ -f "${TEST_DIR}/types_test.py" ]; then
            echo "=== ${TEST_DIR}/types_test.py ==="
            python3 "${TEST_DIR}/types_test.py"
          else
            echo "ERROR: ${TEST_DIR}/types_test.py not installed"
            exit 1
          fi

      - name: Upload CTest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-results-${{ matrix.lib }}-${{ github.sha }}
          path: test-build/Testing/
          retention-days: 7
