# vision-pack build workflow
#
# Builds all four ROCm CV libraries inside manylinux_2_28 against the
# Quartz nightly SDK. Vision libs contain no GPU kernel code so a single
# build covers all supported GPU families — no per-family matrix needed.
#
# Designed as a reusable workflow (workflow_call) so nightly.yml can call
# it after bumping submodules, following TheRock's pattern of using one
# workflow for both PR CI and nightly delivery.
#
# Outputs:
#   vision-pack-staged-multiarch-<sha>   staged install tree (→ package.yml)
#   ctest-results-<sha>                  CTest XML results

name: build

on:
  push:
    branches: [main, develop]
    paths:
      - 'mivisionx'
      - 'rocal'
      - 'rocCV'
      - 'rocpydecode'
      - 'third-party/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, develop]
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build'
        type: string
        required: false
        default: ''
      rocm_sdk_date:
        description: 'Nightly date YYYYMMDD (empty = latest); ignored if rocm_sdk_url set'
        type: string
        required: false
        default: ''
      rocm_sdk_family:
        description: 'SDK GPU family/variant to auto-select from the index'
        type: string
        required: false
        default: ''
      rocm_sdk_url:
        description: 'Full SDK tarball URL to pin (e.g. run-id multi-arch); overrides family/date'
        type: string
        required: false
        default: ''
      release_type:
        description: 'ci | nightly — controls artifact retention'
        type: string
        required: false
        default: 'ci'
    outputs:
      artifact_name:
        description: 'Name of the uploaded staged artifact'
        value: ${{ jobs.build.outputs.artifact_name }}
      buildtree_artifact:
        description: 'Name of the uploaded build-tree artifact (for the test stage)'
        value: ${{ jobs.build.outputs.buildtree_artifact }}
      version:
        description: 'Package version string'
        value: ${{ jobs.build.outputs.version }}
  workflow_dispatch:
    inputs:
      rocm_sdk_date:
        description: 'Nightly date YYYYMMDD (empty = latest); ignored if rocm_sdk_url set'
        required: false
        default: ''
      rocm_sdk_family:
        description: 'SDK GPU family/variant to auto-select from the index'
        required: false
        default: ''
      rocm_sdk_url:
        description: 'Full SDK tarball URL to pin (e.g. run-id multi-arch); overrides family/date'
        required: false
        default: ''
      release_type:
        description: 'ci | nightly'
        required: false
        default: 'ci'

env:
  ROCM_PATH: /opt/rocm-nightly
  CMAKE_BUILD_TYPE: Release
  VP_BUILD_PARALLEL: 24
  # Default SDK family when neither rocm_sdk_url nor rocm_sdk_family is given.
  # Any family works (vision libs have no GPU kernel code); this variant
  # bundles rpp/rocdecode/rocjpeg + share/rocdecode/utils.
  ROCM_SDK_FAMILY_DEFAULT: gfx94X-dcgpu-tests

jobs:
  build:
    # Vision libs have no GPU kernel code — one build covers all GPU families.
    # Use TheRock's pre-built manylinux image which already has gcc-toolset-13,
    # LIBRARY_PATH, and all build prerequisites configured correctly for
    # amdclang++/lld builds. Same image TheRock uses for all its components.
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:cf4f6d9909056906e4a1c0bc4c245658a0af4c6a6174082a86adfa2d518b7aeb
      options: --user root
      # Override any ROCM_PATH the image may have set — ours points at the
      # Quartz nightly SDK tarball extracted to /opt/rocm-nightly.
      env:
        ROCM_PATH: /opt/rocm-nightly

    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      buildtree_artifact: ${{ steps.meta.outputs.buildtree_artifact }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      # TheRock's manylinux image has gcc-toolset-13, cmake 3.27, ninja,
      # Python 3.12 interpreter. We additionally need:
      #   python3-devel — Python.h headers for rocCV/rocAL pybind11 builds
      #     (manylinux /opt/python builds lack dev headers in the system path)
      - name: Install extra build tools
        run: |
          yum install -y python3-devel make curl 2>/dev/null || true

          echo "=== Build environment ==="
          cmake --version
          python3 --version
          g++ --version | head -1
          echo "LIBRARY_PATH=${LIBRARY_PATH}"
          python3 -c "import sysconfig; print('Python include:', sysconfig.get_path('include'))"

          # Put manylinux Python 3.12 on PATH (interpreter + pip)
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      # Download the nightly ROCm SDK tarball.
      # The dcgpu-tests variant bundles the full SDK (HIP, compiler,
      # rocm_sysdeps) *plus* rpp, rocDecode, rocJPEG headers/cmake and the
      # rocDecode build utils (share/rocdecode/utils) under one prefix — so
      # no separate deb overlay is needed. Vision libs have no GPU kernel
      # code, so a single-family SDK builds all supported GPU families.
      - name: Fetch nightly ROCm SDK
        env:
          SDK_DATE: ${{ inputs.rocm_sdk_date }}
          SDK_FAMILY: ${{ inputs.rocm_sdk_family }}
          SDK_URL: ${{ inputs.rocm_sdk_url }}
        run: |
          ARGS="--dest ${ROCM_PATH}"
          if [ -n "${SDK_URL}" ]; then
            # Pin an exact tarball (e.g. run-id multi-arch S3 artifact).
            ARGS="${ARGS} --url ${SDK_URL}"
          else
            FAMILY="${SDK_FAMILY:-${ROCM_SDK_FAMILY_DEFAULT}}"
            ARGS="${ARGS} --gpu-family ${FAMILY}"
            [ -n "${SDK_DATE}" ] && ARGS="${ARGS} --date ${SDK_DATE}"
          fi
          python3 build_tools/fetch_rocm_sdk.py ${ARGS}
          echo "SDK cmake packages available:"
          ls "${ROCM_PATH}/lib/cmake/" | head -30

          # Verify the SDK carries everything we used to pull from deb overlays.
          for CHECK in \
            "${ROCM_PATH}/include/rpp/rpp.h:rpp headers" \
            "${ROCM_PATH}/include/rocjpeg/rocjpeg.h:rocjpeg headers" \
            "${ROCM_PATH}/share/rocdecode/utils/rocvideodecode/roc_video_dec.cpp:rocdecode utils"; do
            PATH_CHECK="${CHECK%%:*}"
            LABEL="${CHECK##*:}"
            ls "${PATH_CHECK}" >/dev/null 2>&1 \
              && echo "  ${LABEL}: OK" \
              || { echo "  ERROR: ${LABEL} not found in SDK tarball"; exit 1; }
          done

      - name: CMake configure
        run: |
          # Single prefix — the dcgpu-tests SDK tarball carries HIP, compiler,
          # rpp, rocdecode, rocjpeg, and rocdecode/utils all under ROCM_PATH.
          CMAKE_PREFIX="${ROCM_PATH};${ROCM_PATH}/lib/llvm"

          # Use the shared Python install which has libpython3.12.so (Development.Embed).
          # The manylinux /opt/python build is statically linked — no libpython.so.
          # TheRock's image installs shared Pythons to /opt/python-shared/.
          SHARED_PY="/opt/python-shared/cp312-cp312"
          if [ -d "${SHARED_PY}" ]; then
            PYTHON_ARGS="-DPython3_ROOT_DIR=${SHARED_PY}"
            echo "Using shared Python at ${SHARED_PY}"
          else
            PYTHON_ARGS=""
            echo "Shared Python not found, using system Python"
          fi

          cmake -B build -S . \
            -GNinja \
            -DCMAKE_BUILD_TYPE="${CMAKE_BUILD_TYPE}" \
            -DROCM_PATH="${ROCM_PATH}" \
            "-DCMAKE_PREFIX_PATH=${CMAKE_PREFIX}" \
            -DVISION_PACK_ENABLE_MIVISIONX=ON \
            -DVISION_PACK_ENABLE_ROCAL=ON \
            -DVISION_PACK_ENABLE_ROCCV=ON \
            -DVISION_PACK_ENABLE_ROCPYDECODE=OFF \
            -DVISION_PACK_BUILD_TESTS=ON \
            -DVP_BUILD_PARALLEL_LEVEL="${VP_BUILD_PARALLEL}" \
            ${PYTHON_ARGS}
          # Log which Python was selected so sub-build failures are diagnosable
          cmake -B build -S . -N -L 2>/dev/null | grep -i "Python3_ROOT\|Python3_EXECUTABLE" || true

      - name: Build
        run: cmake --build build --parallel "${VP_BUILD_PARALLEL}"

      # Stage install — into build/staging/ (mirrors /opt/rocm layout).
      # Bundled sysdeps also land here via the install() rules in third-party/.
      - name: Install to staging
        run: |
          mkdir -p build/staging
          for proj in mivisionx rocCV rocal; do
            cmake --install "build/_subprojects/${proj}/build" \
              --prefix build/staging
          done
          # Install bundled sysdeps (turbojpeg, protobuf, lmdb, libsndfile)
          cmake --install build --prefix build/staging \
            --component rocm-sysdeps-vision 2>/dev/null || true

      # Fail fast if the staged install is missing anything the packaging or
      # test stages rely on — libs, the runvx tool, and rocAL's test dataset.
      - name: Verify install
        run: |
          FAIL=0
          for CHECK in \
            "build/staging/lib/libopenvx.so:mivisionx libopenvx" \
            "build/staging/lib/librocal.so:rocAL librocal" \
            "build/staging/lib/libroccv.so:rocCV libroccv" \
            "build/staging/bin/runvx:mivisionx runvx tool" \
            "build/staging/share/rocal/test/data/images/AMD-tinyDataSet:rocAL test data"; do
            PATH_CHECK="${CHECK%%:*}"
            LABEL="${CHECK##*:}"
            if ls "${PATH_CHECK}" >/dev/null 2>&1; then
              echo "  ${LABEL}: OK"
            else
              echo "  ERROR: ${LABEL} missing (${PATH_CHECK})"
              FAIL=1
            fi
          done
          [ "${FAIL}" -eq 0 ] || { echo "Staged install verification failed"; exit 1; }

      - name: Collect build metadata
        id: meta
        run: |
          VER=$(git describe --tags --always --dirty 2>/dev/null || echo "0.1.0")
          VER="${VER#v}"
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:8}"
          ARTIFACT="vision-pack-staged-multiarch-${SHORT}"
          BUILDTREE="vision-pack-buildtree-${SHORT}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "buildtree_artifact=${BUILDTREE}" >> "$GITHUB_OUTPUT"
          printf '{"version":"%s","sha":"%s","rocm_path":"%s","build_type":"%s","release_type":"%s"}\n' \
            "${VER}" "${SHA}" "${ROCM_PATH}" "${CMAKE_BUILD_TYPE}" \
            "${{ inputs.release_type || 'ci' }}" \
            > build/staging/vision-pack-manifest.json
          echo "Version: ${VER}  Artifact: ${ARTIFACT}  BuildTree: ${BUILDTREE}"

      # Tar the per-library build trees the test stage runs from. ctest executes
      # from build/_subprojects/<lib>/build (test binaries + CTestTestfile.cmake),
      # not the staging install tree. tar preserves exec bits + symlinks that
      # upload-artifact@v4's zip would otherwise drop, keeping binaries runnable.
      - name: Package build tree for tests
        run: |
          tar -czf build-tree.tgz \
            build/_subprojects/mivisionx/build \
            build/_subprojects/rocCV/build \
            build/_subprojects/rocal/build
          echo "build-tree.tgz size: $(du -h build-tree.tgz | cut -f1)"

      - name: Upload staged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: build/staging/
          # Nightly artifacts kept longer than CI artifacts
          retention-days: ${{ inputs.release_type == 'nightly' && 30 || 7 }}

      - name: Upload build-tree artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.buildtree_artifact }}
          path: build-tree.tgz
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Test stage — one matrix leg per library, running in parallel. Each leg pulls
  # the staged install + build-tree artifacts, re-fetches the SDK for runtime
  # libs (and, for rocAL, the toolchain its --build-and-test tests recompile
  # with), then runs that library's CPU-runnable ctests. The runner has no GPU,
  # so legs are non-blocking (continue-on-error) — GPU-variant tests error but
  # do not fail the pipeline. rocPyDecode is disabled for now.
  # ---------------------------------------------------------------------------
  test:
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:cf4f6d9909056906e4a1c0bc4c245658a0af4c6a6174082a86adfa2d518b7aeb
      options: --user root
      env:
        ROCM_PATH: /opt/rocm-nightly
    strategy:
      fail-fast: false
      matrix:
        include:
          - lib: mivisionx
          - lib: rocCV
          - lib: rocal
          # - lib: rocpydecode   # disabled for now

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Install extra build tools
        run: |
          yum install -y python3-devel make curl 2>/dev/null || true
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      # Re-fetch the SDK: provides runtime .so's for all legs, and for rocAL the
      # amdclang++ toolchain its ctests recompile with (--build-and-test).
      - name: Fetch nightly ROCm SDK
        env:
          SDK_DATE: ${{ inputs.rocm_sdk_date }}
          SDK_FAMILY: ${{ inputs.rocm_sdk_family }}
          SDK_URL: ${{ inputs.rocm_sdk_url }}
        run: |
          ARGS="--dest ${ROCM_PATH}"
          if [ -n "${SDK_URL}" ]; then
            ARGS="${ARGS} --url ${SDK_URL}"
          else
            FAMILY="${SDK_FAMILY:-${ROCM_SDK_FAMILY_DEFAULT}}"
            ARGS="${ARGS} --gpu-family ${FAMILY}"
            [ -n "${SDK_DATE}" ] && ARGS="${ARGS} --date ${SDK_DATE}"
          fi
          python3 build_tools/fetch_rocm_sdk.py ${ARGS}

      - name: Download staged install
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: build/staging

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.buildtree_artifact }}
          path: .

      - name: Restore build tree
        run: |
          tar -xzf build-tree.tgz
          ls -d build/_subprojects/*/build

      # rocAL ctests read a hardcoded ${ROCM_PATH}/share/rocal/test/data/ path
      # baked into CTestTestfile.cmake at configure time. Land the staged data
      # under the SDK prefix so those paths resolve.
      - name: Stage rocAL test data into ROCM_PATH
        if: matrix.lib == 'rocal'
        run: |
          mkdir -p "${ROCM_PATH}/share"
          cp -r build/staging/share/rocal "${ROCM_PATH}/share/"
          ls "${ROCM_PATH}/share/rocal/test/data/images/AMD-tinyDataSet" >/dev/null \
            && echo "rocAL test data staged" \
            || { echo "ERROR: rocAL test data not staged"; exit 1; }

      - name: CTest — ${{ matrix.lib }}
        working-directory: build/_subprojects/${{ matrix.lib }}/build
        continue-on-error: true
        env:
          PATH: ${{ github.workspace }}/build/staging/bin:${{ env.ROCM_PATH }}/bin:/opt/python/cp312-cp312/bin:/usr/local/bin:/usr/bin:/bin
          LD_LIBRARY_PATH: >-
            ${{ github.workspace }}/build/staging/lib:${{ env.ROCM_PATH }}/lib:${{ env.ROCM_PATH }}/lib/llvm/lib
          AGO_DEFAULT_TARGET: CPU
        run: |
          case "${{ matrix.lib }}" in
            mivisionx)
              FILTER='-R openvx_gdf_tests_CPU|openvx_vision_coverage' ;;
            rocal)
              # CPU-runnable tests only (basic_test_cpu, unit_tests_cpu, ...).
              FILTER='-R _cpu$' ;;
            rocCV)
              FILTER='' ;;
          esac

          COUNT=$(ctest -N 2>&1 | awk '/Total Tests/{print $NF}')
          echo "Registered tests: ${COUNT:-0}"
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "${{ matrix.lib }}: 0 tests registered — nothing to run"
            exit 0
          fi

          ctest --output-on-failure --parallel 4 \
            ${FILTER} \
            --test-output-size-passed 1024 \
            --test-output-size-failed 102400 \
            -T Test

      - name: Upload CTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-results-${{ matrix.lib }}-${{ github.sha }}
          path: build/_subprojects/${{ matrix.lib }}/build/Testing/
          retention-days: 7
