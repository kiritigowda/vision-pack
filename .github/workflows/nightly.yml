# vision-pack nightly workflow
#
# Runs nightly at 02:00 UTC. Bumps all four vision library submodules to
# their latest develop HEAD, then calls the reusable build workflow. build.yml
# runs the full build → package → test pipeline; with release_type: nightly its
# package job produces DEB/RPM/TGZ and publishes a GitHub prerelease.
#
# Follows TheRock's pattern: one build workflow used for both PR CI and
# nightly, with the nightly orchestrator handling only the submodule bumps.

name: nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      rocm_sdk_date:
        description: 'Nightly date YYYYMMDD (empty = latest); ignored if rocm_sdk_url set'
        required: false
        default: ''
      rocm_sdk_family:
        description: 'SDK GPU family/variant to auto-select from the index'
        required: false
        default: ''
      rocm_sdk_url:
        description: 'Full SDK tarball URL to pin (e.g. run-id multi-arch); overrides family/date'
        required: false
        default: ''
      skip_bump:
        description: 'Skip submodule bump (use current SHAs)'
        type: boolean
        default: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Bump vision library submodules to latest develop HEAD
  # ---------------------------------------------------------------------------
  bump-submodules:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      bumped: ${{ steps.commit.outputs.bumped }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump vision library submodules to develop HEAD
        if: inputs.skip_bump != true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git submodule update --remote mivisionx rocal roccv rocpydecode
          git add mivisionx rocal roccv rocpydecode

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --cached --quiet; then
            echo "No submodule changes"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            SHAS=$(git submodule status mivisionx rocal roccv rocpydecode \
              | awk '{printf "%s %.8s\n", $2, $1}' | tr '\n' ',' | sed 's/,$//')
            MSG=$(printf 'chore(nightly): bump vision submodules to develop HEAD\n\n%s\n\n[skip ci]' "${SHAS}")
            git commit -m "${MSG}"
            git push
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # 2. Build + package (reusable workflow) — single pass, all GPU families.
  # build.yml runs its own build → package → test pipeline; with
  # release_type: nightly its package job cuts the DEB/RPM/tarball and the
  # GitHub prerelease. No separate package job here — build.yml owns packaging.
  # ---------------------------------------------------------------------------
  build:
    needs: bump-submodules
    # package.yml's nightly prerelease step needs to create/replace a GitHub
    # release. Reusable workflows cannot escalate the caller's token, so write
    # must be granted here (the only job that publishes).
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.bump-submodules.outputs.sha }}
      rocm_sdk_date: ${{ inputs.rocm_sdk_date || '' }}
      rocm_sdk_family: ${{ inputs.rocm_sdk_family || '' }}
      rocm_sdk_url: ${{ inputs.rocm_sdk_url || '' }}
      release_type: nightly
    secrets: inherit
