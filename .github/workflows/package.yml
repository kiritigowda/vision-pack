name: package

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID whose artifacts to package'
        required: true
      gpu_family:
        description: 'GPU family'
        required: false
        default: 'gfx110X'
      package_version:
        description: 'Package version override (empty = from git tag)'
        required: false
        default: ''
      rocm_version:
        description: 'ROCm version this was built against'
        required: false
        default: '10.1.0'

jobs:
  package:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --user root

    env:
      GPU_FAMILY: ${{ inputs.gpu_family || 'gfx110X' }}
      ROCM_VERSION: ${{ inputs.rocm_version || '10.1.0' }}

    steps:
      - uses: actions/checkout@v4

      # Resolve the run ID of the CI workflow that produced staged artifacts.
      - name: Resolve CI run ID
        id: run
        run: |
          if [ -n "${{ inputs.ci_run_id }}" ]; then
            echo "id=${{ inputs.ci_run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install packaging tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            cmake dpkg-dev debhelper equivs rpm createrepo-c \
            patchelf python3 curl jq git

      - name: Download staged artifacts
        uses: actions/download-artifact@v4
        with:
          name: vision-pack-staged-${{ env.GPU_FAMILY }}
          path: staging/
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show staging layout
        run: |
          echo "=== Shared libraries ==="
          find staging/ -name "*.so*" | sort | head -30
          echo "=== Manifest ==="
          cat staging/vision-pack-manifest.json 2>/dev/null || echo "(no manifest)"

      - name: Determine package version
        id: version
        run: |
          if [ -n "${{ inputs.package_version }}" ]; then
            VER="${{ inputs.package_version }}"
          else
            VER=$(git describe --tags --abbrev=0 2>/dev/null \
              || jq -r '.version // empty' staging/vision-pack-manifest.json 2>/dev/null \
              || echo "0.1.0")
            VER="${VER#v}"
          fi
          BUILD_ID="${{ steps.run.outputs.id }}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "Package: ${VER}  Build: ${BUILD_ID}"

      - name: Configure CPack
        run: |
          cmake -B pkg-build -S packaging/ \
            -DVISION_PACK_STAGING_DIR="${{ github.workspace }}/staging" \
            -DVISION_PACK_VERSION="${{ steps.version.outputs.version }}" \
            -DVISION_PACK_ROCM_VERSION="${{ env.ROCM_VERSION }}" \
            -DVISION_PACK_BUILD_ID="${{ steps.version.outputs.build_id }}"

      - name: Generate DEB packages
        working-directory: pkg-build
        run: |
          cpack -G DEB --verbose
          ls -lh *.deb 2>/dev/null || echo "No .deb files produced"

      - name: Generate RPM packages
        working-directory: pkg-build
        run: |
          cpack -G RPM --verbose
          ls -lh *.rpm 2>/dev/null || echo "No .rpm files produced"

      - name: Generate tarball
        run: |
          VER="${{ steps.version.outputs.version }}"
          GPU="${{ env.GPU_FAMILY }}"
          TARBALL="vision-pack-dist-linux-${GPU}-${VER}.tar.gz"
          tar -czf "${TARBALL}" -C staging/ .
          ls -lh "${TARBALL}"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Generate meta DEB packages (amdrocm-vision etc.)
        working-directory: pkg-build
        run: |
          if command -v equivs-build >/dev/null 2>&1; then
            cmake --build . --target package-meta-vision 2>/dev/null || \
              echo "Meta package target not available — skipping"
          else
            echo "equivs-build not found — skipping meta-packages"
          fi

      - name: Build APT repo metadata
        run: |
          mkdir -p repo/deb
          cp pkg-build/*.deb repo/deb/ 2>/dev/null || true
          if ls repo/deb/*.deb 1>/dev/null 2>&1; then
            cd repo/deb
            dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz
            dpkg-scanpackages . /dev/null > Packages
            echo "APT repo:"
            ls -lh
          fi

      - name: Build RPM repo metadata
        run: |
          mkdir -p repo/rpm
          cp pkg-build/*.rpm repo/rpm/ 2>/dev/null || true
          if ls repo/rpm/*.rpm 1>/dev/null 2>&1; then
            createrepo_c repo/rpm/
            echo "RPM repo:"
            ls -lh repo/rpm/
          fi

      - name: Upload DEB packages
        uses: actions/upload-artifact@v4
        with:
          name: vision-pack-deb-${{ env.GPU_FAMILY }}-${{ steps.version.outputs.version }}
          path: |
            pkg-build/*.deb
            repo/deb/
          retention-days: 30

      - name: Upload RPM packages
        uses: actions/upload-artifact@v4
        with:
          name: vision-pack-rpm-${{ env.GPU_FAMILY }}-${{ steps.version.outputs.version }}
          path: |
            pkg-build/*.rpm
            repo/rpm/
          retention-days: 30

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: vision-pack-tarball-${{ env.GPU_FAMILY }}-${{ steps.version.outputs.version }}
          path: vision-pack-dist-linux-*.tar.gz
          retention-days: 30

      # Create a GitHub prerelease tagged nightly-<build_id> on main branch.
      # The release notes are written to a temp file to avoid quoting issues.
      - name: Create GitHub prerelease
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build_id }}"
          GPU="${{ env.GPU_FAMILY }}"
          ROCM="${{ env.ROCM_VERSION }}"
          TAG="nightly-${BUILD}"

          gh release delete "${TAG}" --yes 2>/dev/null || true
          git tag -d "${TAG}" 2>/dev/null || true

          cat > /tmp/release-notes.md << NOTES
          Nightly build of amdrocm-vision packages.

          **ROCm version**: ${ROCM}
          **GPU family**: ${GPU}
          **Build**: ${BUILD}

          ## Packages
          - \`amdrocm-mivisionx\` — OpenVX engine + RPP extension (libopenvx, libvxu, libvx_rpp)
          - \`amdrocm-rocal\` — ROCm Augmentation Library + Python bindings
          - \`amdrocm-roccv\` — ROCm GPU image processing + Python bindings
          - \`amdrocm-rocpydecode\` — Python video/JPEG hardware decode bindings

          ## Install (DEB)
          \`\`\`bash
          dpkg -i amdrocm-mivisionx_${VER}_amd64.deb
          dpkg -i amdrocm-rocal_${VER}_amd64.deb
          dpkg -i amdrocm-roccv_${VER}_amd64.deb
          dpkg -i amdrocm-rocpydecode_${VER}_amd64.deb
          \`\`\`

          Requires ROCm ${ROCM} or later.
          NOTES

          gh release create "${TAG}" \
            --prerelease \
            --title "vision-pack nightly ${VER} (build ${BUILD})" \
            --notes-file /tmp/release-notes.md \
            pkg-build/*.deb \
            pkg-build/*.rpm \
            vision-pack-dist-linux-*.tar.gz \
            2>/dev/null || echo "Release creation skipped (no packages found)"

      - name: Smoke test DEB install
        run: |
          if ls pkg-build/amdrocm-mivisionx_*.deb 1>/dev/null 2>&1; then
            dpkg -i pkg-build/amdrocm-mivisionx_*.deb 2>/dev/null || \
              dpkg --ignore-depends=amdrocm-rpp \
                -i pkg-build/amdrocm-mivisionx_*.deb || \
              echo "DEB install skipped (missing ROCm deps on packaging runner)"
          fi
