# vision-pack packaging workflow
#
# Consumes staged artifacts from build.yml and produces:
#   - DEB packages  (amdrocm-mivisionx, -rocal, -roccv, -rocpydecode + variants)
#   - RPM packages  (same naming)
#   - Tarball       (vision-pack-dist-linux-multiarch-<version>.tar.gz)
#   - Meta-packages (amdrocm-vision, amdrocm-vision-sdk, amdrocm-vision-tests)
#   - GitHub prerelease with all assets attached (nightly only)
#
# Designed as a reusable workflow (workflow_call) so nightly.yml can call it,
# following TheRock/RVS pattern of separating build from packaging.

name: package

on:
  workflow_call:
    inputs:
      artifact_name:
        description: 'Name of the staged artifact from build.yml'
        type: string
        required: true
      package_version:
        description: 'Package version string'
        type: string
        required: false
        default: ''
      release_type:
        description: 'ci | nightly'
        type: string
        required: false
        default: 'ci'
      sha:
        description: 'Git SHA that was built'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      artifact_name:
        description: 'Staged artifact name (from build.yml run)'
        required: true
      package_version:
        description: 'Package version override'
        required: false
        default: ''
      rocm_version:
        description: 'ROCm version this was built against'
        required: false
        default: '10.2.0'
      release_type:
        description: 'ci | nightly'
        required: false
        default: 'ci'

jobs:
  package:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --user root

    env:
      ROCM_VERSION: ${{ inputs.rocm_version || '10.2.0' }}

    outputs:
      version: ${{ steps.version.outputs.version }}
      build_id: ${{ steps.version.outputs.build_id }}

    steps:
      - uses: actions/checkout@v7

      - name: Install packaging tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            cmake dpkg-dev debhelper equivs rpm createrepo-c \
            patchelf python3 curl jq git
          # This job also runs as root against a checkout owned by the runner
          # user; without this git refuses to read the repository and the
          # version lookup below can never resolve a tag.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Download staged artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: staging-archive/

      # build.yml uploads the staging tree as a tarball so the artifact
      # round-trip preserves symlinks and exec bits (#43, #44). Unpack it here
      # and everything downstream — CPack and the dist tarball — sees the tree
      # exactly as it was staged.
      - name: Unpack staged tree
        run: |
          mkdir -p staging
          tar -xzf staging-archive/vision-pack-staging.tar.gz -C staging
          echo "runvx: $(stat -c '%a %n' staging/bin/runvx 2>/dev/null || echo absent)"
          echo "libvx_rpp chain:"
          ls -l staging/lib/libvx_rpp.so* 2>/dev/null || true

      - name: Show staging layout
        run: |
          echo "=== Top-level staging dirs ==="
          ls -la staging/ || echo "(staging missing)"
          echo "=== include/ tree (headers the -devel packages need) ==="
          find staging/include -maxdepth 2 2>/dev/null | sort | head -40 \
            || echo "(no staging/include — CPack -devel installs will fail)"
          echo "=== Shared libraries ==="
          find staging/ -name "*.so*" | sort | head -30
          echo ""
          echo "=== Manifest ==="
          cat staging/share/vision-pack/vision-pack-manifest.json 2>/dev/null \
            | python3 -m json.tool || echo "(no manifest)"

      - name: Determine package version
        id: version
        run: |
          if [ -n "${{ inputs.package_version }}" ]; then
            VER="${{ inputs.package_version }}"
          else
            VER=$(git describe --tags --abbrev=0 2>/dev/null \
              || jq -r '.version // empty' staging/share/vision-pack/vision-pack-manifest.json 2>/dev/null \
              || echo "0.1.0")
            VER="${VER#v}"
          fi
          # Build ID: use run_id for CI, date for nightly
          if [ "${{ inputs.release_type }}" = "nightly" ]; then
            BUILD_ID=$(date -u +%Y%m%d)
          else
            BUILD_ID="${{ github.run_id }}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "Package: ${VER}  Build: ${BUILD_ID}  Type: ${{ inputs.release_type }}"

      - name: Configure CPack
        run: |
          # Use $GITHUB_WORKSPACE (env var), not ${{ github.workspace }}.
          # This job runs in a container where the repo is mounted at
          # /__w/... but the github.workspace *context* expands to the host
          # path /home/runner/work/..., which does not exist inside the
          # container — CPack then bakes a bad absolute staging path into its
          # install rules and fails on the first non-OPTIONAL install
          # (include/mivisionx). $GITHUB_WORKSPACE is set to the container
          # mount path, so it resolves correctly.
          cmake -B pkg-build -S packaging/ \
            -DVISION_PACK_STAGING_DIR="${GITHUB_WORKSPACE}/staging" \
            -DVISION_PACK_VERSION="${{ steps.version.outputs.version }}" \
            -DVISION_PACK_ROCM_VERSION="${{ env.ROCM_VERSION }}" \
            -DVISION_PACK_BUILD_ID="${{ steps.version.outputs.build_id }}"

      - name: Generate DEB packages
        working-directory: pkg-build
        run: |
          cpack -G DEB --verbose
          ls -lh *.deb 2>/dev/null || echo "No .deb files produced"
          # The rocpydecode modules install to lib/ (CMAKE_INSTALL_LIBDIR=lib);
          # the packaging globs read from staging/lib/, so a regression that put
          # them back in lib64/ would silently ship an empty amdrocm-pydecode.
          # Assert the .so payload is actually inside the package. Non-blocking:
          # rocpydecode is best-effort (#290), so if the whole build was dropped
          # the package is legitimately absent — only warn, never fail here.
          echo "=== amdrocm-pydecode contents ==="
          PYDECODE_DEB=$(ls amdrocm-*-rocpydecode.deb 2>/dev/null | head -1)
          if [ -z "${PYDECODE_DEB}" ]; then
            echo "::warning::no rocpydecode .deb produced (rocpydecode build dropped?)"
          else
            CONTENTS=$(dpkg-deb -c "${PYDECODE_DEB}" 2>/dev/null || true)
            echo "${CONTENTS}" | grep -E 'lib/(rocpydecode|rocpyjpegdecode).*\.so' || true
            for MOD in rocpydecode rocpyjpegdecode; do
              if echo "${CONTENTS}" | grep -qE "lib/${MOD}.*\.so"; then
                echo "  ${MOD} .so packaged: OK"
              else
                echo "::warning::${MOD} .so missing from ${PYDECODE_DEB} — modules not in staging/lib/ (empty package)"
              fi
            done
          fi

      - name: Inspect DEB metadata and payload
        working-directory: pkg-build
        run: |
          set -u
          FAIL=0
          for DEB in *.deb; do
            [ -f "${DEB}" ] || continue
            echo "=================================================================="
            echo "### ${DEB}"
            echo "--- control (dpkg-deb --info) ---"
            dpkg-deb --field "${DEB}" \
              Package Version Architecture Section Priority Installed-Size \
              Maintainer Homepage Depends
            echo "--- payload (dpkg-deb --contents) ---"
            CONTENTS="$(dpkg-deb --contents "${DEB}")"
            echo "${CONTENTS}" | awk 'NF>=6 && $1 !~ /^d/ {print}' | head -25
            FILES="$(echo "${CONTENTS}" | awk '$1 !~ /^d/' | wc -l)"
            LINKS="$(echo "${CONTENTS}" | awk '$1 ~ /^l/' | wc -l)"
            echo "--- summary: ${FILES} file(s), ${LINKS} symlink(s) ---"

            PKG="$(dpkg-deb --field "${DEB}" Package)"
            # Not fatal: rocpydecode is built best-effort, so its packages are
            # legitimately empty when that build was dropped.
            [ "${FILES}" -eq 0 ] && echo "::warning::${PKG} contains no files"
            VER="$(dpkg-deb --field "${DEB}" Version)"
            # Every payload path must live under /opt/rocm. The one exception is
            # the .pth, which only works from a real site directory.
            # Field 6 is the path; $NF would be the link target on symlink lines.
            STRAY="$(echo "${CONTENTS}" | awk '$1 !~ /^d/ {print $6}' \
              | grep -v '^\./opt/rocm/' \
              | grep -v '^\./usr/lib/python3/dist-packages/' || true)"
            if [ -n "${STRAY}" ]; then
              echo "  ERROR: ${PKG} ships paths outside /opt/rocm:"
              echo "${STRAY}" | sed 's/^/    /'
              FAIL=1
            fi
            # A Debian version must begin with a digit. Warn rather than fail:
            # the version is supplied by the caller, so this is a guard against
            # a bad value reaching the packages, not a build-local invariant.
            case "${VER}" in
              [0-9]*) ;;
              *) echo "::warning::${PKG} version '${VER}' does not start with a digit; dependency expressions referencing it cannot be satisfied" ;;
            esac
          done

          echo "=================================================================="
          echo "### declared dependency graph"
          for DEB in *.deb; do
            [ -f "${DEB}" ] || continue
            printf '%-34s -> %s\n' \
              "$(dpkg-deb --field "${DEB}" Package)" \
              "$(dpkg-deb --field "${DEB}" Depends)"
          done

          # amdrocm-rocal links libopenvx/libvx_rpp, so it must pull MIVisionX in.
          ROCAL_DEB=""
          for d in *.deb; do
            if [ "$(dpkg-deb --field "$d" Package)" = "amdrocm-rocal" ]; then
              ROCAL_DEB="$d"
              break
            fi
          done
          if [ -n "${ROCAL_DEB:-}" ]; then
            DEPS="$(dpkg-deb --field "${ROCAL_DEB}" Depends)"
            for REQ in amdrocm-mivisionx amdrocm-vision-sysdeps amdrocm-vision-pythonpath; do
              if echo "${DEPS}" | grep -q "${REQ}"; then
                echo "  amdrocm-rocal depends on ${REQ}: OK"
              else
                echo "  ERROR: amdrocm-rocal is missing a dependency on ${REQ}"
                FAIL=1
              fi
            done
          else
            echo "::warning::amdrocm-rocal .deb not found; dependency check skipped"
          fi
          [ "${FAIL}" -eq 0 ] || { echo "DEB inspection failed"; exit 1; }

      - name: Generate RPM packages
        working-directory: pkg-build
        run: |
          cpack -G RPM --verbose
          ls -lh *.rpm 2>/dev/null || echo "No .rpm files produced"

      - name: Inspect RPM metadata and payload
        working-directory: pkg-build
        run: |
          set -u
          command -v rpm >/dev/null 2>&1 || { echo "rpm not available"; exit 0; }
          for RPMF in *.rpm; do
            [ -f "${RPMF}" ] || continue
            echo "=================================================================="
            echo "### ${RPMF}"
            rpm -qp --queryformat \
              'Name:     %{NAME}\nVersion:  %{VERSION}-%{RELEASE}\nArch:     %{ARCH}\nLicense:  %{LICENSE}\nSize:     %{SIZE}\nSummary:  %{SUMMARY}\n' \
              "${RPMF}" 2>/dev/null || true
            echo "--- requires ---"
            rpm -qp --requires "${RPMF}" 2>/dev/null | grep -v '^rpmlib(' | sed 's/^/  /' || true
            echo "--- payload (first 15) ---"
            rpm -qp --list "${RPMF}" 2>/dev/null | head -15 | sed 's/^/  /' || true
          done

      - name: Generate multiarch tarball
        run: |
          VER="${{ steps.version.outputs.version }}"
          TARBALL="vision-pack-dist-linux-multiarch-${VER}.tar.gz"
          tar -czf "${TARBALL}" -C staging/ .
          ls -lh "${TARBALL}"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"
          # What users actually extract. A flattened SONAME chain double-loads
          # libvx_rpp and segfaults rocalCreate() (#43); a non-executable runvx
          # fails every runvx-based test (#44).
          FAIL=0
          echo "=== libvx_rpp chain in the dist tarball ==="
          CHAIN="$(tar -tvzf "${TARBALL}" | grep 'lib/libvx_rpp\.so' || true)"
          echo "${CHAIN}"
          LINKS="$(printf '%s\n' "${CHAIN}" | grep -c '^l' || true)"
          if [ "${LINKS}" -lt 2 ]; then
            echo "ERROR: libvx_rpp SONAME chain is not symlinked in the tarball"
            FAIL=1
          fi
          echo "=== runvx mode in the dist tarball ==="
          RUNVX="$(tar -tvzf "${TARBALL}" | grep 'bin/runvx' || true)"
          echo "${RUNVX}"
          # Match the mode field only; the filename itself contains an "x".
          RUNVX_MODE="$(printf '%s\n' "${RUNVX}" | awk 'NR==1{print $1}')"
          case "${RUNVX_MODE}" in
            *x*) echo "runvx is executable: OK" ;;
            "")  echo "ERROR: runvx absent from tarball"; FAIL=1 ;;
            *)   echo "ERROR: runvx is not executable in the tarball"; FAIL=1 ;;
          esac
          [ "${FAIL}" -eq 0 ] || exit 1

      - name: Generate meta DEB packages
        working-directory: pkg-build
        run: |
          cmake --build . --target package-meta-vision 2>/dev/null \
            || echo "Meta packages skipped (equivs-build not available)"
          # equivs-build writes each meta .deb into its WORKING_DIRECTORY
          # (pkg-build/meta). Collect them next to the component .debs so the
          # repo/upload steps pick up amdrocm-vision, -sdk and -tests too.
          cp meta/*.deb . 2>/dev/null || echo "(no meta .debs produced)"
          echo "Meta packages:"; ls -1 *.deb | grep -E 'amdrocm-vision(-sdk|-tests)?_' || true
          # #3 AC2: when equivs-build is present (it is in CI, installed above),
          # all three meta-packages must be produced. equivs-build builds one
          # .deb per control file, so a missing stanza/template silently drops a
          # package — assert each exists rather than soft-passing.
          if command -v equivs-build >/dev/null 2>&1; then
            MISSING=0
            for m in amdrocm-vision amdrocm-vision-sdk amdrocm-vision-tests; do
              if ls "${m}_"*.deb >/dev/null 2>&1; then
                echo "  ${m}: OK"
              else
                echo "  ERROR: meta-package ${m} was not produced"; MISSING=1
              fi
            done
            [ "${MISSING}" -eq 0 ] || { echo "Meta-package generation incomplete"; exit 1; }
          fi

      - name: Build APT repo metadata
        run: |
          mkdir -p repo/deb
          cp pkg-build/*.deb repo/deb/ 2>/dev/null || true
          if ls repo/deb/*.deb 1>/dev/null 2>&1; then
            cd repo/deb
            dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz
            dpkg-scanpackages . /dev/null > Packages
            echo "APT repo: $(ls *.deb | wc -l) packages"
          fi

      - name: Build RPM repo metadata
        run: |
          mkdir -p repo/rpm
          cp pkg-build/*.rpm repo/rpm/ 2>/dev/null || true
          if ls repo/rpm/*.rpm 1>/dev/null 2>&1; then
            createrepo_c repo/rpm/
            echo "RPM repo: $(ls repo/rpm/*.rpm | wc -l) packages"
          fi

      - name: Upload DEB packages
        uses: actions/upload-artifact@v7
        with:
          name: vision-pack-deb-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_id }}
          path: |
            pkg-build/*.deb
            repo/deb/
          retention-days: ${{ inputs.release_type == 'nightly' && 30 || 7 }}

      - name: Upload RPM packages
        uses: actions/upload-artifact@v7
        with:
          name: vision-pack-rpm-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_id }}
          path: |
            pkg-build/*.rpm
            repo/rpm/
          retention-days: ${{ inputs.release_type == 'nightly' && 30 || 7 }}

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: vision-pack-tarball-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_id }}
          path: vision-pack-dist-linux-multiarch-*.tar.gz
          retention-days: ${{ inputs.release_type == 'nightly' && 30 || 7 }}

      # Create a GitHub prerelease for nightly builds only.
      # Tagged nightly-YYYYMMDD, replaces previous day's tag.
      - name: Create GitHub prerelease (nightly only)
        if: inputs.release_type == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build_id }}"
          ROCM="${{ env.ROCM_VERSION }}"
          TAG="nightly-${BUILD}"
          SHA="${{ inputs.sha || github.sha }}"

          # Replace previous nightly tag
          gh release delete "${TAG}" --yes 2>/dev/null || true
          git tag -d "${TAG}" 2>/dev/null || true

          cat > /tmp/release-notes.md << NOTES
          Nightly build of AMD ROCm Computer Vision extension pack.

          **Version**: ${VER}
          **ROCm**: ${ROCM}
          **Commit**: ${SHA}

          ## Libraries
          - **amdrocm-mivisionx** — MIVisionX OpenVX engine + RPP extension
          - **amdrocm-rocal** — rocAL augmentation library + Python bindings
          - **amdrocm-roccv** — rocCV GPU image processing + Python bindings
          - **amdrocm-pydecode** — Python video/JPEG hardware decode
          - **amdrocm-vision-sysdeps** — bundled runtime deps (libturbojpeg, libprotobuf, liblmdb, libsndfile)

          ## Install (DEB)
          \`\`\`bash
          dpkg -i amdrocm-mivisionx_${VER}_amd64.deb
          dpkg -i amdrocm-rocal_${VER}_amd64.deb
          dpkg -i amdrocm-roccv_${VER}_amd64.deb
          dpkg -i amdrocm-pydecode_${VER}_amd64.deb
          dpkg -i amdrocm-vision-sysdeps_${VER}_amd64.deb
          \`\`\`

          Requires ROCm ${ROCM} or later installed at /opt/rocm.
          NOTES

          gh release create "${TAG}" \
            --prerelease \
            --title "vision-pack nightly ${VER} (${BUILD})" \
            --notes-file /tmp/release-notes.md \
            pkg-build/*.deb \
            pkg-build/*.rpm \
            vision-pack-dist-linux-multiarch-*.tar.gz \
            2>/dev/null || echo "Release upload skipped (no packages)"

  # ---------------------------------------------------------------------------
  # Per-package validation.
  #
  # Walks every produced DEB one at a time, printing its control metadata
  # (dpkg -I) and payload listing (dpkg -c), then checking the things that have
  # actually broken before: missing payload, paths escaping /opt/rocm, flattened
  # SONAME chains, non-executable binaries, un-isolated bundled SONAMEs and
  # incomplete control fields. Kept as a separate stage so a packaging fault is
  # reported independently of the runtime smoke tests.
  # ---------------------------------------------------------------------------
  validate-packages:
    needs: package
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --user root

    steps:
      - uses: actions/checkout@v7

      - name: Install dpkg tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends dpkg-dev

      - name: Download DEB artifact
        uses: actions/download-artifact@v8
        with:
          name: vision-pack-deb-${{ needs.package.outputs.version }}-${{ needs.package.outputs.build_id }}
          path: debs/

      - name: Validate every package
        run: bash build_tools/validate_packages.sh debs

  # ---------------------------------------------------------------------------
  # Clean-runner package-install smoke test (#4).
  #
  # Installs the produced runtime DEBs on a pristine ubuntu:24.04 (no build
  # tools, no ROCm SDK) and asserts the side-by-side isolation guarantee:
  #   1. librocal.so's bundled-dep NEEDED entries are all private
  #      *-rocm-vision SONAMEs (never the stock names).
  #   2. Even with host copies of protobuf/turbojpeg/lmdb/sndfile installed on
  #      the default loader path, ldd resolves the bundled deps to
  #      /opt/rocm/lib/rocm_sysdeps/lib, not /usr/lib.
  #   3. The amdrocm-vision.pth registers /opt/rocm/lib on sys.path so the
  #      vision Python modules are importable with no PYTHONPATH.
  # ---------------------------------------------------------------------------
  smoke-test:
    needs: package
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --user root

    steps:
      - name: Install minimal runtime tools
        run: |
          apt-get update -qq
          # binutils → readelf; libc-bin → ldd; python3 for the import check.
          # NO build tools, NO ROCm — this is a clean runtime host on purpose.
          apt-get install -y --no-install-recommends binutils libc-bin python3
          # Plant host copies carrying the STOCK sonames that the bundled deps
          # were renamed away from, so the isolation assertion later has
          # something that could shadow them. This has to happen here, before
          # the vision DEBs: those are force-installed with unsatisfiable ROCm
          # depends, after which apt refuses to resolve anything else.
          # One package per call — apt aborts the whole transaction on a single
          # unknown name, which previously left no decoys planted at all.
          for PKG in libturbojpeg libprotobuf32t64 libprotobuf-lite32t64 \
                     liblmdb0 libsndfile1; do
            apt-get install -y --no-install-recommends "${PKG}" \
              || echo "::warning::decoy package ${PKG} unavailable"
          done

      - name: Download DEB artifact
        uses: actions/download-artifact@v8
        with:
          name: vision-pack-deb-${{ needs.package.outputs.version }}-${{ needs.package.outputs.build_id }}
          path: debs/

      - name: Install runtime DEBs
        run: |
          set -eux
          # CPack emits amdrocm-vision-<ver>-Linux-<component>.deb. Install the
          # sysdeps + pythonpath first (no external deps), then the vision libs.
          find debs -name '*.deb' -print
          deb() { find debs -name "amdrocm-vision-*-Linux-$1.deb" | head -1; }
          dpkg -i "$(deb rocm-sysdeps-vision)" "$(deb pythonpath)"
          # rocal/roccv/mivisionx carry external ROCm depends (rpp/hip/decode/
          # jpeg) not present on a bare runner; force-install the payloads so we
          # can inspect the shipped .so files for isolation.
          for comp in mivisionx roccv rocal rocpydecode; do
            f="$(deb "$comp")"
            [ -n "$f" ] && dpkg --force-depends -i "$f"
          done
          echo "=== installed vision tree ==="
          ls -la /opt/rocm/lib/rocm_sysdeps/lib/ || true

      - name: Assert bundled SONAMEs are isolated
        run: |
          set -eu
          FAIL=0
          # Check every shipped library, not just librocal: any of them could
          # pick up a bundled dep, and a stock SONAME on any one of them is
          # exactly what a host copy could shadow.
          echo "=== every shipped .so references only isolated SONAMEs ==="
          CHECKED=0
          for LIB in /opt/rocm/lib/*.so*; do
            { [ -f "${LIB}" ] && [ ! -L "${LIB}" ]; } || continue
            CHECKED=$((CHECKED + 1))
            N="$(readelf -d "${LIB}" 2>/dev/null | grep -i NEEDED || true)"
            STOCK="$(echo "${N}" \
              | grep -Ei "lib(protobuf|protobuf-lite|turbojpeg|jpeg|lmdb|sndfile)\.so" \
              | grep -iv "rocm-vision" || true)"
            if [ -n "${STOCK}" ]; then
              echo "  ERROR: $(basename "${LIB}") references a stock bundled SONAME:"
              echo "${STOCK}" | sed 's/^/      /'
              FAIL=1
            else
              echo "  $(basename "${LIB}"): OK"
            fi
          done
          if [ "${CHECKED}" -eq 0 ]; then
            echo "ERROR: no libraries found under /opt/rocm/lib to check"; exit 1
          fi
          echo "  ${CHECKED} librar(ies) checked"

          LIB=/opt/rocm/lib/librocal.so
          if [ ! -e "$LIB" ]; then
            echo "ERROR: $LIB not installed"; exit 1
          fi
          echo "=== librocal.so NEEDED ==="
          NEEDED="$(readelf -d "$LIB" | grep -i NEEDED || true)"
          echo "${NEEDED}"
          if ! echo "${NEEDED}" | grep -qi "libprotobuf-rocm-vision"; then
            echo "ERROR: librocal.so missing isolated protobuf NEEDED"; FAIL=1
          fi
          # #39: librocal uses the raw libjpeg API (jpeg_std_error) but rocAL only
          # links libturbojpeg. Assert librocal NEEDs the isolated libjpeg AND
          # that libjpeg actually exports jpeg_std_error, so the symbol resolves
          # at load time. A full dlopen isn't possible here (external hip/rpp
          # deps absent), so this symbol-level check is the clean-runner ceiling.
          if ! echo "${NEEDED}" | grep -qi "libjpeg-rocm-vision"; then
            echo "ERROR: librocal.so missing isolated libjpeg NEEDED (#39)"; FAIL=1
          fi
          JPEGLIB="$(find /opt/rocm/lib/rocm_sysdeps/lib -name 'libjpeg-rocm-vision.so*' \
            -type f | head -1)"
          if [ -z "${JPEGLIB}" ]; then
            echo "ERROR: isolated libjpeg not shipped in rocm_sysdeps (#39)"; FAIL=1
          elif ! readelf -sW "${JPEGLIB}" | grep -q ' jpeg_std_error$'; then
            echo "ERROR: ${JPEGLIB} does not export jpeg_std_error (#39)"; FAIL=1
          else
            echo "isolated libjpeg exports jpeg_std_error: OK"
          fi
          [ "${FAIL}" -eq 0 ] || exit 1
          echo "librocal.so bundled deps are all isolated: OK"

      - name: Assert host copies do not shadow bundled deps
        run: |
          set -eu
          # The decoys carrying the stock sonames were installed before the
          # vision DEBs (see "Install minimal runtime tools"). If isolation
          # works, ldd must still bind the bundled *-rocm-vision copies from
          # rocm_sysdeps rather than these. The assertion only means something
          # if they are actually present, so fail when none were planted.
          echo "=== stock sonames planted on the default loader path ==="
          PLANTED=0
          for SO in libturbojpeg.so.0 libprotobuf.so.32 liblmdb.so.0 libsndfile.so.1; do
            HIT="$(ldconfig -p | grep -F "${SO}" | head -1 || true)"
            if [ -n "${HIT}" ]; then
              echo "  ${HIT}"
              PLANTED=$((PLANTED + 1))
            else
              echo "  ${SO}: not planted"
            fi
          done
          if [ "${PLANTED}" -eq 0 ]; then
            echo "ERROR: no conflicting host copies could be installed, so this"
            echo "       check would pass without proving any isolation"
            exit 1
          fi
          echo "  ${PLANTED} stock soname(s) present"
          # Resolve every shipped library, not just librocal. ldd cannot fully
          # resolve them here (hip/rpp are absent by design), but the bundled
          # deps must still bind to rocm_sysdeps rather than the planted copies.
          echo "=== isolated deps resolve to rocm_sysdeps for every library ==="
          for L in /opt/rocm/lib/*.so*; do
            { [ -f "${L}" ] && [ ! -L "${L}" ]; } || continue
            OUT="$(ldd "${L}" 2>/dev/null | grep -i 'rocm-vision' || true)"
            [ -n "${OUT}" ] || continue
            OUTSIDE="$(echo "${OUT}" | grep -v 'rocm_sysdeps/lib' || true)"
            if [ -n "${OUTSIDE}" ]; then
              echo "  ERROR: $(basename "${L}") resolved an isolated dep outside rocm_sysdeps:"
              echo "${OUTSIDE}" | sed 's/^/      /'
              exit 1
            fi
            echo "  $(basename "${L}"): $(echo "${OUT}" | grep -c .) isolated dep(s) from rocm_sysdeps"
          done
          echo "=== ldd librocal.so (bundled-dep lines) ==="
          LDD="$(ldd /opt/rocm/lib/librocal.so || true)"
          echo "${LDD}" | grep -Ei "rocm-vision|protobuf|turbojpeg|jpeg|lmdb|sndfile" || true
          # Each isolated dep must resolve to a file under rocm_sysdeps/lib, not
          # a host copy. Match the rocm_sysdeps/lib suffix rather than a literal
          # absolute path: librocal's RPATH is $ORIGIN/../lib/rocm_sysdeps/lib,
          # so ldd prints /opt/rocm/lib/../lib/rocm_sysdeps/lib (unnormalized).
          BAD=$(echo "${LDD}" | grep -Ei "rocm-vision" | grep -Ev "rocm_sysdeps/lib" || true)
          if [ -n "${BAD}" ]; then
            echo "ERROR: an isolated dep resolved outside rocm_sysdeps:"; echo "${BAD}"; exit 1
          fi
          echo "bundled deps resolve to rocm_sysdeps despite host copies: OK"

      - name: Assert Python path registration (no PYTHONPATH)
        run: |
          set -eu
          unset PYTHONPATH || true
          echo "=== .pth shipped? ==="
          ls -l /usr/lib/python3/dist-packages/amdrocm-vision.pth
          echo "=== /opt/rocm/lib on sys.path? ==="
          python3 - <<'PY'
          import sys
          hit = any(p.rstrip("/") == "/opt/rocm/lib" for p in sys.path)
          print("sys.path entries under /opt/rocm:",
                [p for p in sys.path if "/opt/rocm" in p])
          if not hit:
              print("ERROR: /opt/rocm/lib not on sys.path — .pth not honored")
              sys.exit(1)
          print(".pth registered /opt/rocm/lib on sys.path: OK")
          PY

  # ---------------------------------------------------------------------------
  # Downstream find_package() smoke test (#3, acceptance criterion 3).
  #
  # Upstream MIVisionX/rocAL ship no package config (MIVisionX#1761, rocAL#514),
  # so vision-pack installs transitional FindMIVisionX.cmake / Findrocal.cmake
  # shims into lib/cmake. This job proves a downstream CMake project can actually
  # find_package(MIVisionX) / find_package(rocal) after installing only the -dev
  # DEBs — a green configure means the shims resolved headers + libraries.
  #
  # Unlike smoke-test (deliberately no build tools), this needs cmake + a C++
  # compiler, so it runs on the host runner rather than the bare container.
  # ---------------------------------------------------------------------------
  findpackage-test:
    needs: package
    runs-on: ubuntu-24.04

    steps:
      - name: Install cmake + compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake g++ dpkg-dev

      - name: Download DEB artifact
        uses: actions/download-artifact@v8
        with:
          name: vision-pack-deb-${{ needs.package.outputs.version }}-${{ needs.package.outputs.build_id }}
          path: debs/

      - name: Install -dev DEBs
        run: |
          set -eux
          # CPack emits amdrocm-vision-<ver>-Linux-<component>.deb. The -dev
          # components carry the headers + the Find*.cmake shims. Their runtime
          # counterparts pull external ROCm deps not present here, so force-
          # install payloads to lay down the files we need to discover.
          deb() { find debs -name "amdrocm-vision-*-Linux-$1.deb" | head -1; }
          for comp in rocm-sysdeps-vision mivisionx mivisionx-dev rocal rocal-dev \
                      roccv roccv-dev; do
            f="$(deb "$comp")"
            [ -n "$f" ] && sudo dpkg --force-depends -i "$f" || echo "(skip $comp)"
          done
          echo "=== installed cmake shims ==="
          ls -la /opt/rocm/lib/cmake/Find*.cmake
          echo "=== installed package configs ==="
          find /opt/rocm/lib/cmake -name '*Config.cmake' | sed 's/^/  /'

      - name: Configure a downstream project against the shims
        run: |
          set -eu
          WORK="$(mktemp -d)"
          cat > "${WORK}/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(vp_findpackage_smoke LANGUAGES CXX)
          list(APPEND CMAKE_MODULE_PATH "/opt/rocm/lib/cmake")
          list(APPEND CMAKE_PREFIX_PATH "/opt/rocm")
          find_package(MIVisionX REQUIRED)
          find_package(rocal REQUIRED)
          # rocCV, unlike the other two, ships a real config package upstream,
          # so it is discovered in CONFIG mode rather than through a shim.
          find_package(roccv REQUIRED CONFIG)
          message(STATUS "MIVisionX_LIBRARIES=${MIVisionX_LIBRARIES}")
          message(STATUS "MIVisionX_INCLUDE_DIRS=${MIVisionX_INCLUDE_DIRS}")
          message(STATUS "rocal_LIBRARIES=${rocal_LIBRARIES}")
          message(STATUS "rocal_INCLUDE_DIRS=${rocal_INCLUDE_DIRS}")
          message(STATUS "roccv_FOUND=${roccv_FOUND} roccv_DIR=${roccv_DIR}")
          CMAKE
          echo "=== configuring downstream find_package project ==="
          cmake -S "${WORK}" -B "${WORK}/build" -DROCM_PATH=/opt/rocm
          echo "find_package for MIVisionX, rocal and roccv resolved: OK"
