# vision-pack packaging workflow
#
# Consumes staged artifacts from build.yml and produces:
#   - DEB packages  (amdrocm-mivisionx, -rocal, -roccv, -rocpydecode + variants)
#   - RPM packages  (same naming)
#   - Tarball       (vision-pack-dist-linux-multiarch-<version>.tar.gz)
#   - Meta-packages (amdrocm-vision, amdrocm-vision-sdk, amdrocm-vision-tests)
#   - GitHub prerelease with all assets attached (nightly only)
#
# Designed as a reusable workflow (workflow_call) so nightly.yml can call it,
# following TheRock/RVS pattern of separating build from packaging.

name: package

on:
  workflow_call:
    inputs:
      artifact_name:
        description: 'Name of the staged artifact from build.yml'
        type: string
        required: true
      package_version:
        description: 'Package version string'
        type: string
        required: false
        default: ''
      release_type:
        description: 'ci | nightly'
        type: string
        required: false
        default: 'ci'
      sha:
        description: 'Git SHA that was built'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      artifact_name:
        description: 'Staged artifact name (from build.yml run)'
        required: true
      package_version:
        description: 'Package version override'
        required: false
        default: ''
      rocm_version:
        description: 'ROCm version this was built against'
        required: false
        default: '10.2.0'
      release_type:
        description: 'ci | nightly'
        required: false
        default: 'ci'

jobs:
  package:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --user root

    env:
      ROCM_VERSION: ${{ inputs.rocm_version || '10.2.0' }}

    outputs:
      version: ${{ steps.version.outputs.version }}
      build_id: ${{ steps.version.outputs.build_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            cmake dpkg-dev debhelper equivs rpm createrepo-c \
            patchelf python3 curl jq git

      - name: Download staged artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: staging/

      - name: Show staging layout
        run: |
          echo "=== Top-level staging dirs ==="
          ls -la staging/ || echo "(staging missing)"
          echo "=== include/ tree (headers the -devel packages need) ==="
          find staging/include -maxdepth 2 2>/dev/null | sort | head -40 \
            || echo "(no staging/include — CPack -devel installs will fail)"
          echo "=== Shared libraries ==="
          find staging/ -name "*.so*" | sort | head -30
          echo ""
          echo "=== Manifest ==="
          cat staging/vision-pack-manifest.json 2>/dev/null \
            | python3 -m json.tool || echo "(no manifest)"

      - name: Determine package version
        id: version
        run: |
          if [ -n "${{ inputs.package_version }}" ]; then
            VER="${{ inputs.package_version }}"
          else
            VER=$(git describe --tags --abbrev=0 2>/dev/null \
              || jq -r '.version // empty' staging/vision-pack-manifest.json 2>/dev/null \
              || echo "0.1.0")
            VER="${VER#v}"
          fi
          # Build ID: use run_id for CI, date for nightly
          if [ "${{ inputs.release_type }}" = "nightly" ]; then
            BUILD_ID=$(date -u +%Y%m%d)
          else
            BUILD_ID="${{ github.run_id }}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "Package: ${VER}  Build: ${BUILD_ID}  Type: ${{ inputs.release_type }}"

      - name: Configure CPack
        run: |
          # Use $GITHUB_WORKSPACE (env var), not ${{ github.workspace }}.
          # This job runs in a container where the repo is mounted at
          # /__w/... but the github.workspace *context* expands to the host
          # path /home/runner/work/..., which does not exist inside the
          # container — CPack then bakes a bad absolute staging path into its
          # install rules and fails on the first non-OPTIONAL install
          # (include/mivisionx). $GITHUB_WORKSPACE is set to the container
          # mount path, so it resolves correctly.
          cmake -B pkg-build -S packaging/ \
            -DVISION_PACK_STAGING_DIR="${GITHUB_WORKSPACE}/staging" \
            -DVISION_PACK_VERSION="${{ steps.version.outputs.version }}" \
            -DVISION_PACK_ROCM_VERSION="${{ env.ROCM_VERSION }}" \
            -DVISION_PACK_BUILD_ID="${{ steps.version.outputs.build_id }}"

      - name: Generate DEB packages
        working-directory: pkg-build
        run: |
          cpack -G DEB --verbose
          ls -lh *.deb 2>/dev/null || echo "No .deb files produced"

      - name: Generate RPM packages
        working-directory: pkg-build
        run: |
          cpack -G RPM --verbose
          ls -lh *.rpm 2>/dev/null || echo "No .rpm files produced"

      - name: Generate multiarch tarball
        run: |
          VER="${{ steps.version.outputs.version }}"
          TARBALL="vision-pack-dist-linux-multiarch-${VER}.tar.gz"
          tar -czf "${TARBALL}" -C staging/ .
          ls -lh "${TARBALL}"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Generate meta DEB packages
        working-directory: pkg-build
        run: |
          cmake --build . --target package-meta-vision 2>/dev/null \
            || echo "Meta packages skipped (equivs-build not available)"
          # equivs-build writes each meta .deb into its WORKING_DIRECTORY
          # (pkg-build/meta). Collect them next to the component .debs so the
          # repo/upload steps pick up amdrocm-vision, -sdk and -tests too.
          cp meta/*.deb . 2>/dev/null || echo "(no meta .debs produced)"
          echo "Meta packages:"; ls -1 *.deb | grep -E 'amdrocm-vision(-sdk|-tests)?_' || true
          # #3 AC2: when equivs-build is present (it is in CI, installed above),
          # all three meta-packages must be produced. equivs-build builds one
          # .deb per control file, so a missing stanza/template silently drops a
          # package — assert each exists rather than soft-passing.
          if command -v equivs-build >/dev/null 2>&1; then
            MISSING=0
            for m in amdrocm-vision amdrocm-vision-sdk amdrocm-vision-tests; do
              if ls "${m}_"*.deb >/dev/null 2>&1; then
                echo "  ${m}: OK"
              else
                echo "  ERROR: meta-package ${m} was not produced"; MISSING=1
              fi
            done
            [ "${MISSING}" -eq 0 ] || { echo "Meta-package generation incomplete"; exit 1; }
          fi

      - name: Build APT repo metadata
        run: |
          mkdir -p repo/deb
          cp pkg-build/*.deb repo/deb/ 2>/dev/null || true
          if ls repo/deb/*.deb 1>/dev/null 2>&1; then
            cd repo/deb
            dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz
            dpkg-scanpackages . /dev/null > Packages
            echo "APT repo: $(ls *.deb | wc -l) packages"
          fi

      - name: Build RPM repo metadata
        run: |
          mkdir -p repo/rpm
          cp pkg-build/*.rpm repo/rpm/ 2>/dev/null || true
          if ls repo/rpm/*.rpm 1>/dev/null 2>&1; then
            createrepo_c repo/rpm/
            echo "RPM repo: $(ls repo/rpm/*.rpm | wc -l) packages"
          fi

      - name: Upload DEB packages
        uses: actions/upload-artifact@v7
        with:
          name: vision-pack-deb-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_id }}
          path: |
            pkg-build/*.deb
            repo/deb/
          retention-days: ${{ inputs.release_type == 'nightly' && 30 || 7 }}

      - name: Upload RPM packages
        uses: actions/upload-artifact@v7
        with:
          name: vision-pack-rpm-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_id }}
          path: |
            pkg-build/*.rpm
            repo/rpm/
          retention-days: ${{ inputs.release_type == 'nightly' && 30 || 7 }}

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: vision-pack-tarball-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_id }}
          path: vision-pack-dist-linux-multiarch-*.tar.gz
          retention-days: ${{ inputs.release_type == 'nightly' && 30 || 7 }}

      # Create a GitHub prerelease for nightly builds only.
      # Tagged nightly-YYYYMMDD, replaces previous day's tag.
      - name: Create GitHub prerelease (nightly only)
        if: inputs.release_type == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build_id }}"
          ROCM="${{ env.ROCM_VERSION }}"
          TAG="nightly-${BUILD}"
          SHA="${{ inputs.sha || github.sha }}"

          # Replace previous nightly tag
          gh release delete "${TAG}" --yes 2>/dev/null || true
          git tag -d "${TAG}" 2>/dev/null || true

          cat > /tmp/release-notes.md << NOTES
          Nightly build of AMD ROCm Computer Vision extension pack.

          **Version**: ${VER}
          **ROCm**: ${ROCM}
          **Commit**: ${SHA}

          ## Libraries
          - **amdrocm-mivisionx** — MIVisionX OpenVX engine + RPP extension
          - **amdrocm-rocal** — rocAL augmentation library + Python bindings
          - **amdrocm-roccv** — rocCV GPU image processing + Python bindings
          - **amdrocm-pydecode** — Python video/JPEG hardware decode
          - **amdrocm-vision-sysdeps** — bundled runtime deps (libturbojpeg, libprotobuf, liblmdb, libsndfile)

          ## Install (DEB)
          \`\`\`bash
          dpkg -i amdrocm-mivisionx_${VER}_amd64.deb
          dpkg -i amdrocm-rocal_${VER}_amd64.deb
          dpkg -i amdrocm-roccv_${VER}_amd64.deb
          dpkg -i amdrocm-pydecode_${VER}_amd64.deb
          dpkg -i amdrocm-vision-sysdeps_${VER}_amd64.deb
          \`\`\`

          Requires ROCm ${ROCM} or later installed at /opt/rocm.
          NOTES

          gh release create "${TAG}" \
            --prerelease \
            --title "vision-pack nightly ${VER} (${BUILD})" \
            --notes-file /tmp/release-notes.md \
            pkg-build/*.deb \
            pkg-build/*.rpm \
            vision-pack-dist-linux-multiarch-*.tar.gz \
            2>/dev/null || echo "Release upload skipped (no packages)"

  # ---------------------------------------------------------------------------
  # Clean-runner package-install smoke test (#4).
  #
  # Installs the produced runtime DEBs on a pristine ubuntu:24.04 (no build
  # tools, no ROCm SDK) and asserts the side-by-side isolation guarantee:
  #   1. librocal.so's bundled-dep NEEDED entries are all private
  #      *-rocm-vision SONAMEs (never the stock names).
  #   2. Even with host copies of protobuf/turbojpeg/lmdb/sndfile installed on
  #      the default loader path, ldd resolves the bundled deps to
  #      /opt/rocm/lib/rocm_sysdeps/lib, not /usr/lib.
  #   3. The amdrocm-vision.pth registers /opt/rocm/lib on sys.path so the
  #      vision Python modules are importable with no PYTHONPATH.
  # ---------------------------------------------------------------------------
  smoke-test:
    needs: package
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --user root

    steps:
      - name: Install minimal runtime tools
        run: |
          apt-get update -qq
          # binutils → readelf; libc-bin → ldd; python3 for the import check.
          # NO build tools, NO ROCm — this is a clean runtime host on purpose.
          apt-get install -y --no-install-recommends binutils libc-bin python3

      - name: Download DEB artifact
        uses: actions/download-artifact@v8
        with:
          name: vision-pack-deb-${{ needs.package.outputs.version }}-${{ needs.package.outputs.build_id }}
          path: debs/

      - name: Install runtime DEBs
        run: |
          set -eux
          # CPack emits amdrocm-vision-<ver>-Linux-<component>.deb. Install the
          # sysdeps + pythonpath first (no external deps), then the vision libs.
          find debs -name '*.deb' -print
          deb() { find debs -name "amdrocm-vision-*-Linux-$1.deb" | head -1; }
          dpkg -i "$(deb rocm-sysdeps-vision)" "$(deb pythonpath)"
          # rocal/roccv/mivisionx carry external ROCm depends (rpp/hip/decode/
          # jpeg) not present on a bare runner; force-install the payloads so we
          # can inspect the shipped .so files for isolation.
          for comp in mivisionx roccv rocal; do
            f="$(deb "$comp")"
            [ -n "$f" ] && dpkg --force-depends -i "$f"
          done
          echo "=== installed vision tree ==="
          ls -la /opt/rocm/lib/rocm_sysdeps/lib/ || true

      - name: Assert bundled SONAMEs are isolated
        run: |
          set -eu
          FAIL=0
          LIB=/opt/rocm/lib/librocal.so
          if [ ! -e "$LIB" ]; then
            echo "ERROR: $LIB not installed"; exit 1
          fi
          echo "=== librocal.so NEEDED ==="
          NEEDED="$(readelf -d "$LIB" | grep -i NEEDED || true)"
          echo "${NEEDED}"
          # Every bundled-dep reference must be a private *-rocm-vision SONAME.
          if echo "${NEEDED}" \
              | grep -Ei "lib(protobuf|protobuf-lite|turbojpeg|jpeg|lmdb|sndfile)\.so" \
              | grep -qiv "rocm-vision"; then
            echo "ERROR: librocal.so references a stock bundled SONAME"; FAIL=1
          fi
          if ! echo "${NEEDED}" | grep -qi "libprotobuf-rocm-vision"; then
            echo "ERROR: librocal.so missing isolated protobuf NEEDED"; FAIL=1
          fi
          [ "${FAIL}" -eq 0 ] || exit 1
          echo "librocal.so bundled deps are all isolated: OK"

      - name: Assert host copies do not shadow bundled deps
        run: |
          set -eu
          # Install conflicting host copies with the STOCK sonames on the
          # default loader path. If isolation works, ldd must still bind the
          # bundled *-rocm-vision copies from rocm_sysdeps, not these.
          apt-get install -y --no-install-recommends \
            libprotobuf32t64 libturbojpeg0 liblmdb0 libsndfile1 || \
          apt-get install -y --no-install-recommends \
            libprotobuf-lite32t64 libturbojpeg0 liblmdb0 libsndfile1 || true
          echo "=== ldd librocal.so (bundled-dep lines) ==="
          LDD="$(ldd /opt/rocm/lib/librocal.so || true)"
          echo "${LDD}" | grep -Ei "rocm-vision|protobuf|turbojpeg|jpeg|lmdb|sndfile" || true
          # Each isolated dep must resolve to a file under rocm_sysdeps/lib, not
          # a host copy. Match the rocm_sysdeps/lib suffix rather than a literal
          # absolute path: librocal's RPATH is $ORIGIN/../lib/rocm_sysdeps/lib,
          # so ldd prints /opt/rocm/lib/../lib/rocm_sysdeps/lib (unnormalized).
          BAD=$(echo "${LDD}" | grep -Ei "rocm-vision" | grep -Ev "rocm_sysdeps/lib" || true)
          if [ -n "${BAD}" ]; then
            echo "ERROR: an isolated dep resolved outside rocm_sysdeps:"; echo "${BAD}"; exit 1
          fi
          echo "bundled deps resolve to rocm_sysdeps despite host copies: OK"

      - name: Assert Python path registration (no PYTHONPATH)
        run: |
          set -eu
          unset PYTHONPATH || true
          echo "=== .pth shipped? ==="
          ls -l /usr/lib/python3/dist-packages/amdrocm-vision.pth
          echo "=== /opt/rocm/lib on sys.path? ==="
          python3 - <<'PY'
          import sys
          hit = any(p.rstrip("/") == "/opt/rocm/lib" for p in sys.path)
          print("sys.path entries under /opt/rocm:",
                [p for p in sys.path if "/opt/rocm" in p])
          if not hit:
              print("ERROR: /opt/rocm/lib not on sys.path — .pth not honored")
              sys.exit(1)
          print(".pth registered /opt/rocm/lib on sys.path: OK")
          PY

  # ---------------------------------------------------------------------------
  # Downstream find_package() smoke test (#3, acceptance criterion 3).
  #
  # Upstream MIVisionX/rocAL ship no package config (MIVisionX#1761, rocAL#514),
  # so vision-pack installs transitional FindMIVisionX.cmake / Findrocal.cmake
  # shims into lib/cmake. This job proves a downstream CMake project can actually
  # find_package(MIVisionX) / find_package(rocal) after installing only the -dev
  # DEBs — a green configure means the shims resolved headers + libraries.
  #
  # Unlike smoke-test (deliberately no build tools), this needs cmake + a C++
  # compiler, so it runs on the host runner rather than the bare container.
  # ---------------------------------------------------------------------------
  findpackage-test:
    needs: package
    runs-on: ubuntu-24.04

    steps:
      - name: Install cmake + compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake g++ dpkg-dev

      - name: Download DEB artifact
        uses: actions/download-artifact@v8
        with:
          name: vision-pack-deb-${{ needs.package.outputs.version }}-${{ needs.package.outputs.build_id }}
          path: debs/

      - name: Install -dev DEBs
        run: |
          set -eux
          # CPack emits amdrocm-vision-<ver>-Linux-<component>.deb. The -dev
          # components carry the headers + the Find*.cmake shims. Their runtime
          # counterparts pull external ROCm deps not present here, so force-
          # install payloads to lay down the files we need to discover.
          deb() { find debs -name "amdrocm-vision-*-Linux-$1.deb" | head -1; }
          for comp in rocm-sysdeps-vision mivisionx mivisionx-dev rocal rocal-dev; do
            f="$(deb "$comp")"
            [ -n "$f" ] && sudo dpkg --force-depends -i "$f" || echo "(skip $comp)"
          done
          echo "=== installed cmake shims ==="
          ls -la /opt/rocm/lib/cmake/Find*.cmake

      - name: Configure a downstream project against the shims
        run: |
          set -eu
          WORK="$(mktemp -d)"
          cat > "${WORK}/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(vp_findpackage_smoke LANGUAGES CXX)
          list(APPEND CMAKE_MODULE_PATH "/opt/rocm/lib/cmake")
          find_package(MIVisionX REQUIRED)
          find_package(rocal REQUIRED)
          message(STATUS "MIVisionX_LIBRARIES=${MIVisionX_LIBRARIES}")
          message(STATUS "MIVisionX_INCLUDE_DIRS=${MIVisionX_INCLUDE_DIRS}")
          message(STATUS "rocal_LIBRARIES=${rocal_LIBRARIES}")
          message(STATUS "rocal_INCLUDE_DIRS=${rocal_INCLUDE_DIRS}")
          CMAKE
          echo "=== configuring downstream find_package project ==="
          cmake -S "${WORK}" -B "${WORK}/build" -DROCM_PATH=/opt/rocm
          echo "find_package(MIVisionX) and find_package(rocal) resolved: OK"
