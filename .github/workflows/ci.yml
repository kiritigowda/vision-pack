name: ci

on:
  push:
    branches: [main, develop]
    paths:
      - 'mivisionx'
      - 'rocal'
      - 'rocCV'
      - 'rocpydecode'
      - 'third-party/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      rocm_sdk_date:
        description: 'Quartz nightly date YYYYMMDD (empty = latest)'
        required: false
        default: ''
      gpu_family:
        description: 'GPU family tarball to use'
        required: false
        default: 'gfx110X'
      bump_submodules:
        description: 'Bump vision library submodules to develop HEAD'
        type: boolean
        default: false

env:
  ROCM_PATH: /opt/rocm-nightly
  CMAKE_BUILD_TYPE: Release
  VP_BUILD_PARALLEL: 24

jobs:
  # ---------------------------------------------------------------------------
  # Bump submodules to latest develop HEAD (nightly schedule only)
  # ---------------------------------------------------------------------------
  bump-submodules:
    if: github.event_name == 'schedule' || inputs.bump_submodules == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump vision library submodules to develop HEAD
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git submodule update --remote mivisionx rocal rocCV rocpydecode
          git add mivisionx rocal rocCV rocpydecode

      - name: Commit bump if changed
        id: commit
        run: |
          if git diff --cached --quiet; then
            echo "No submodule changes"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            SHAS=$(git submodule status mivisionx rocal rocCV rocpydecode \
              | awk '{printf "%s %.8s\n", $2, $1}' | tr '\n' ',' | sed 's/,$//')
            COMMIT_MSG=$(printf 'chore(nightly): bump vision submodules to develop HEAD\n\n%s\n\n[skip ci]' "${SHAS}")
            git commit -m "${COMMIT_MSG}"
            git push
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Build — manylinux_2_28 container (same base as TheRock)
  # ---------------------------------------------------------------------------
  build:
    needs: [bump-submodules]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
      options: --user root

    strategy:
      fail-fast: false
      matrix:
        gpu_family:
          - ${{ inputs.gpu_family || 'gfx110X' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.bump-submodules.outputs.sha || github.sha }}

      # manylinux_2_28 ships Python 3.12 at /opt/python/cp312-cp312/bin.
      # Put it on PATH so `python3` resolves to 3.12 for our scripts.
      - name: Set up Python 3.12 from manylinux
        run: echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      # Only build-time tools — all runtime deps (turbojpeg, lmdb, libsndfile,
      # protobuf) are built from source in third-party/ and bundled with the
      # package. ffmpeg and OpenCV are excluded by design.
      - name: Install build tools
        run: |
          dnf install -y \
            cmake ninja-build \
            python3-devel \
            tar gzip curl make \
            || true

      # Download the Quartz nightly ROCm SDK tarball for this GPU family.
      # If rocm_sdk_date is provided pin to that date, otherwise use latest.
      - name: Fetch Quartz nightly ROCm SDK
        env:
          GPU_FAMILY: ${{ matrix.gpu_family }}
          SDK_DATE: ${{ inputs.rocm_sdk_date }}
        run: |
          ARGS="--gpu-family ${GPU_FAMILY} --dest ${ROCM_PATH}"
          if [ -n "${SDK_DATE}" ]; then
            ARGS="${ARGS} --date ${SDK_DATE}"
          fi
          python3 build_tools/fetch_rocm_sdk.py ${ARGS}
          echo "ROCm nightly cmake packages:"
          ls ${ROCM_PATH}/lib/cmake/ | head -20

      # Install amdrocm-decode-dev, amdrocm-decode-test, amdrocm-jpeg-dev,
      # and amdrocm-jpeg-test from the nightly deb repo by extracting .deb
      # files directly with dpkg-deb --extract (no dpkg database required —
      # works on any Linux including manylinux/RHEL).
      #
      # The nightly rpm repo is not reliably available; the deb repo always is.
      # dpkg-deb is available on RHEL/AlmaLinux 8 via the dpkg package.
      #
      # Packages needed:
      #   amdrocm-decode-dev   — rocdecode headers and cmake config
      #   amdrocm-decode-test  — rocdecode utility sources (rocvideodecode/,
      #                          resize_kernels.cpp) required at build time
      #                          by rocAL and rocPyDecode
      #   amdrocm-jpeg-dev     — rocJPEG headers and cmake config (rocAL)
      #   amdrocm-jpeg-test    — rocJPEG utility sources
      - name: Install rocdecode and rocjpeg dev/test packages from nightly deb
        run: |
          dnf install -y dpkg 2>/dev/null || true

          DEB_BASE="https://rocm.nightlies.amd.com/packages-multi-arch/deb"

          # Find the latest nightly deb build
          LATEST=$(curl -sL "${DEB_BASE}/" \
            | grep -o '[0-9]\{8\}-[0-9]*' | sort | tail -1)
          if [ -z "${LATEST}" ]; then
            echo "ERROR: could not determine latest nightly deb build"
            exit 1
          fi
          echo "Nightly deb build: ${LATEST}"

          POOL="${DEB_BASE}/${LATEST}/pool/main"
          DEST="${ROCM_PATH}"

          # Packages to extract — dev provides headers/cmake, test provides
          # utility sources needed at build time by rocAL and rocPyDecode
          PKGS="
            amdrocm-decode-dev
            amdrocm-decode-test
            amdrocm-jpeg-dev
            amdrocm-jpeg-test
            amdrocm-rpp
            amdrocm-rpp-dev
            amdrocm-rpp-test
          "

          # Parse Packages.gz to get exact filenames for this build
          PACKAGES_GZ="${DEB_BASE}/${LATEST}/dists/stable/main/binary-amd64/Packages.gz"
          PACKAGES_TMP=$(mktemp)
          curl -sL "${PACKAGES_GZ}" | zcat > "${PACKAGES_TMP}"

          for PKG in ${PKGS}; do
            FILENAME=$(awk "/^Package: ${PKG}$/{found=1} found && /^Filename:/{print \$2; exit}" \
              "${PACKAGES_TMP}")
            if [ -z "${FILENAME}" ]; then
              echo "WARNING: ${PKG} not found in Packages index — skipping"
              continue
            fi
            DEB_URL="${DEB_BASE}/${LATEST}/${FILENAME}"
            DEB_FILE=$(mktemp --suffix=.deb)
            echo "  Downloading ${PKG}..."
            curl -fsSL "${DEB_URL}" -o "${DEB_FILE}"
            dpkg-deb --extract "${DEB_FILE}" "${DEST}"
            rm -f "${DEB_FILE}"
            echo "  Installed ${PKG} -> ${DEST}"
          done
          rm -f "${PACKAGES_TMP}"

          # Verify the critical utility sources landed
          echo ""
          echo "=== rocdecode utils ==="
          ls "${ROCM_PATH}/share/rocdecode/utils/" 2>/dev/null \
            && echo "rocdecode utils: OK" \
            || echo "ERROR: rocdecode utils not found — check package extraction"

          echo "=== rocjpeg headers ==="
          ls "${ROCM_PATH}/include/rocjpeg/rocjpeg.h" 2>/dev/null \
            && echo "rocjpeg headers: OK" \
            || echo "WARNING: rocjpeg headers not found"

          echo "=== rpp headers ==="
          ls "${ROCM_PATH}/include/rpp/rpp.h" 2>/dev/null \
            && echo "rpp headers: OK" \
            || echo "ERROR: rpp headers not found — MIVisionX will fail to configure"

      - name: CMake configure
        env:
          ROCM_PATH: ${{ env.ROCM_PATH }}
        run: |
          cmake -B build -S . \
            -GNinja \
            -DCMAKE_BUILD_TYPE="${CMAKE_BUILD_TYPE}" \
            -DROCM_PATH="${ROCM_PATH}" \
            -DCMAKE_INSTALL_PREFIX="${ROCM_PATH}" \
            -DVISION_PACK_ENABLE_MIVISIONX=ON \
            -DVISION_PACK_ENABLE_ROCAL=ON \
            -DVISION_PACK_ENABLE_ROCCV=ON \
            -DVISION_PACK_ENABLE_ROCPYDECODE=ON \
            -DVP_BUILD_PARALLEL_LEVEL="${VP_BUILD_PARALLEL}"

      - name: Build
        run: cmake --build build --parallel "${VP_BUILD_PARALLEL}"

      - name: Install to staging
        run: |
          mkdir -p build/staging
          for proj in mivisionx rocCV rocpydecode rocal; do
            cmake --install "build/_subprojects/${proj}/build" \
              --prefix build/staging
          done

      - name: CTest — rocPyDecode
        working-directory: build/_subprojects/rocpydecode/build
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/staging/lib:${{ env.ROCM_PATH }}/lib
        run: |
          ctest --output-on-failure --parallel 4 \
            --test-output-size-passed 1024 \
            --test-output-size-failed 102400 \
            -T Test

      - name: CTest — MIVisionX
        working-directory: build/_subprojects/mivisionx/build
        env:
          PATH: ${{ github.workspace }}/build/staging/bin:${{ env.ROCM_PATH }}/bin:/usr/local/bin:/usr/bin:/bin
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/staging/lib:${{ env.ROCM_PATH }}/lib
        run: |
          ctest --output-on-failure --parallel 4 \
            -R "openvx_gdf_tests_CPU|openvx_vision_coverage" \
            --test-output-size-passed 1024 \
            --test-output-size-failed 102400 \
            -T Test
        continue-on-error: true

      - name: CTest — rocCV
        working-directory: build/_subprojects/rocCV/build
        env:
          LD_LIBRARY_PATH: >-
            ${{ github.workspace }}/build/staging/lib:${{ env.ROCM_PATH }}/lib:${{ env.ROCM_PATH }}/lib/llvm/lib
        run: |
          COUNT=$(ctest -N 2>&1 | grep "Total Tests" | awk '{print $NF}')
          echo "rocCV registered tests: ${COUNT:-0}"
          if [ "${COUNT:-0}" -gt 0 ]; then
            ctest --output-on-failure --parallel 4 -T Test
          else
            echo "No tests (TESTS=OFF). Use -DFULL_BUILD=ON to enable."
          fi
        continue-on-error: true

      - name: Write build manifest
        run: |
          VER=$(git describe --tags --always --dirty 2>/dev/null || echo "0.1.0")
          printf '{"version":"%s","sha":"%s","gpu_family":"%s","rocm_path":"%s","build_type":"%s"}\n' \
            "${VER}" \
            "${{ github.sha }}" \
            "${{ matrix.gpu_family }}" \
            "${ROCM_PATH}" \
            "${CMAKE_BUILD_TYPE}" \
            > build/staging/vision-pack-manifest.json

      - name: Upload CTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-results-${{ matrix.gpu_family }}
          path: build/_subprojects/*/build/Testing/
          retention-days: 14

      - name: Upload staged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vision-pack-staged-${{ matrix.gpu_family }}
          path: build/staging/
          retention-days: 7
